HOOK_TRAILER:{
  label:"Hook trailer", on:"trailer", actor:"Driver", ref:"model §5.2",
  gate(w,c){
    const t = c.t;
    if (!t) return [H(CLS.STRUCTURAL,"No trailer in context")];
    if (t.tractor) return [H(CLS.STRUCTURAL,"A tractor is already attached")];
    if (!onSite(t) && t.position!=="LOT") return [H(CLS.PHYSICAL,"Trailer is not here")];
    const v = c.v;
    const tl = v && takeLeg(w,v);
    if (!tl || tl.trailer_id!==t.id)
      return [H(CLS.STRUCTURAL,"This trailer is not on a TAKE leg")];
    const f = [];
    if (v.presence!=="ON_SITE") f.push(D(CLS.PHYSICAL, WHY.NOT_ADMITTED));
    if (openSession(w,t.id)) f.push(D(CLS.PHYSICAL, WHY.SESSION_OPEN));
    if (openMove(w,t.id)) f.push(D(CLS.PHYSICAL,"A move is in progress"));
    f.push(...svc(w,t));
    return f;
  },
  apply(w,c){
    const t = c.t;
    t.tractor = true;
    const mv = openMove(w,t.id);
    if (mv){ mv.state = "CANCELLED"; log("sys","Pending move task cancelled — a hooked trailer needs none."); }
    log("act","<b>HOOK_TRAILER</b> — tractor attached. <b>TRACTOR_ATTACHED</b>; no move task from here.");
  }
},

/* ENGINE ACTION — finding F10.
   §5 has no action that changes the position of a trailer with a tractor
   attached. DRIVER_SELF was deleted because a driver "needs a destination, not
   a task", but nothing then records him arriving at it. Flows 1, 2, 3 and 5 and
   stress tests 1-vi, 1-x and 12 cannot be walked without something here, so the
   bench supplies it and marks it as its own. */
DRIVER_POSITIONS:{
  label:"Driver spots it himself", on:"trailer", actor:"Driver",
  engine:true, ref:"ENGINE — §5 names no such action (F10)",
  gate(w,c){
    const t = c.t;
    if (!t) return [H(CLS.STRUCTURAL,"No trailer in context")];
    if (!t.tractor) return [H(CLS.STRUCTURAL,"No tractor attached — this is yard-team work")];
    const v = c.v;
    if (v && !["ON_SITE","AUTHORIZED_TO_DEPART"].includes(v.presence))
      return [D(CLS.PHYSICAL, WHY.NOT_ADMITTED)];
    const f = [];
    const authorized = v && v.presence==="AUTHORIZED_TO_DEPART";
    if (!authorized && t.destination==="NONE") f.push(D(CLS.DATA, WHY.NO_DEST));
    if (!authorized && atDestination(w,t)) f.push(H(CLS.STRUCTURAL,"Already at its destination"));
    const s = openSession(w,t.id);
    if (s) f.push(D(CLS.PHYSICAL, s.state==="ACTIVE" ? WHY.SESSION_ACTIVE : WHY.SESSION_OPEN));
    return f;
  },
  form(w,c){
    const t = c.t, v = c.v;
    const opts = [];
    if (t.requested_destination && t.requested_destination!=="YARD")
      opts.push([t.requested_destination.startsWith("DOCK")||t.requested_destination.startsWith("SPOT")||
        t.requested_destination.startsWith("LOT") ? t.requested_destination :
        "SPOT "+t.requested_destination, "Where he was told to go"]);
    Object.values(w.docks).forEach(d => opts.push(["DOCK "+d.id,"Dock "+d.id]));
    Object.values(w.spots).forEach(s => opts.push(["SPOT "+s.id,"Spot "+s.id +
      (s.occupants.length?" (occupied)":"")]));
    Object.values(w.lots).forEach(l => opts.push(["LOT "+l.id,
      l.inside_fence?"Inside lot":"Outside lot"]));
    if (v && v.presence==="AUTHORIZED_TO_DEPART") opts.unshift(["GATE_OUT","The exit lane"]);
    return [{k:"where", label:"Where the driver puts it", type:"select", options:opts}];
  },
  apply(w,c,vals){
    const t = c.t;
    if (vals.where==="GATE_OUT"){
      releasePosition(w,t); t.position = "AT_GATE_OUT";
      log("act","Driver pulls off and takes it to the exit lane — <b>position → AT_GATE_OUT</b>.");
      return;
    }
    placeAt(w,t,vals.where);
    if (t.position==="DOCK"){
      const a = heldAssign(w,t.id);
      if (a && a.dock===t.dock){ a.state="FULFILLED"; }
      t.stay = {dock:t.dock, opened_at:w.clock};
      w.docks[t.dock].state = "OCCUPIED"; w.docks[t.dock].holder = t.id;
      if (sensorsLive(w)) w.docks[t.dock].sensor = "OCCUPIED";
    }
    log("act","Driver positions the trailer himself — <b>position → "+vals.where+
      "</b>. <b>No move task exists or ever existed.</b>");
    log("sys","This step has no action in the catalog. See finding F10.");
  }
},

CREATE_MOVE_TASK:{
  label:"Create move task", on:"trailer", actor:"Dispatcher", ref:"model §5.2 · §3.5",
  gate(w,c){
    const t = c.t;
    if (!t) return [H(CLS.STRUCTURAL,"No trailer in context")];
    if (t.tractor) return [H(CLS.STRUCTURAL,"Trailer has a driver — it needs a destination, not a task")];
    if (openMove(w,t.id)) return [D(CLS.PHYSICAL, WHY.MOVE_OPEN)];
    const f = [];
    if (!onSite(t) && t.position!=="LOT") f.push(H(CLS.PHYSICAL,"Trailer is not on site"));
    const v = c.v;
    if (v && ["AT_FACILITY","AT_GATE"].includes(v.presence)) f.push(D(CLS.PHYSICAL, WHY.NOT_ADMITTED));
    if (t.destination==="AWAITING_ASSIGNMENT" || t.destination==="NONE")
      f.push(D(CLS.DATA, WHY.NO_DEST));
    if (atDestination(w,t)) f.push(H(CLS.STRUCTURAL,"Already at its destination"));
    const sess = openSession(w,t.id);
    if (sess) f.push(D(CLS.PHYSICAL, sess.state==="ACTIVE" ? WHY.SESSION_ACTIVE : WHY.SESSION_OPEN));
    return f;
  },
  apply(w,c){
    const t = c.t;
    w.moves.push({id:"MV"+(w.seq++), trailer_id:t.id,
      requested_destination: t.requested_destination || (t.destination==="YARD_ASSIGNED"?"YARD":"—"),
      state:"PENDING", at:w.clock});
    log("act","<b>CREATE_MOVE_TASK</b> — <b>PENDING</b> to "+
      (t.requested_destination||"the yard")+". Every row in this queue is yard-team work.");
  }
},

ASSIGN_MOVE_TASK:{
  label:"Assign move to a spotter", on:"trailer", actor:"Dispatcher", ref:"model §5.2",
  gate(w,c){
    const m = c.t && openMove(w,c.t.id);
    if (!m) return [H(CLS.STRUCTURAL,"No open move task")];
    if (m.state!=="PENDING") return [H(CLS.STRUCTURAL,"Already assigned")];
    return [];
  },
  apply(w,c){
    const m = openMove(w,c.t.id);
    m.state = "ASSIGNED"; m.assignee = "Spotter 3";
    log("act","<b>ASSIGN_MOVE_TASK</b> — to Spotter 3.");
  }
},

START_MOVE:{
  label:"Start move", on:"trailer", actor:"Spotter", ref:"model §5.2",
  gate(w,c){
    const t = c.t, m = t && openMove(w,t.id);
    if (!m) return [H(CLS.STRUCTURAL,"No open move task")];
    if (!["PENDING","ASSIGNED"].includes(m.state)) return [H(CLS.STRUCTURAL,"Move already started")];
    const f = [];
    const sess = openSession(w,t.id);
    if (sess && sess.state==="ACTIVE") f.push(D(CLS.PHYSICAL, WHY.SESSION_ACTIVE));
    else if (sess) f.push(D(CLS.PHYSICAL, WHY.SESSION_OPEN));
    return f;
  },
  apply(w,c){
    const t = c.t, m = openMove(w,t.id);
    m.state = "IN_PROGRESS"; m.origin = t.position;
    if (t.position==="DOCK" && t.stay){
      log("sys","DockStay on dock "+t.dock+" closed on move start.");
      w.docks[t.dock].state = "FREE"; w.docks[t.dock].holder = null;
      if (sensorsLive(w)) w.docks[t.dock].sensor = "VACANT";
      t.stay = null;
    }
    releasePosition(w,t);
    t.position = "IN_MOTION";
    log("act","<b>START_MOVE</b> — <b>position → IN_MOTION</b>; origin released.");
  }
},

COMPLETE_MOVE:{
  label:"Complete move", on:"trailer", actor:"Spotter", ref:"model §5.2 (§9 #8)",
  gate(w,c){
    const m = c.t && openMove(w,c.t.id);
    if (!m) return [H(CLS.STRUCTURAL,"No move in progress")];
    if (m.state!=="IN_PROGRESS") return [H(CLS.STRUCTURAL,"Move has not started")];
    return [];
  },
  form(w,c){
    const m = openMove(w,c.t.id);
    const req = m.requested_destination||"";
    const sensorAuto = sensorsLive(w) && req.startsWith("DOCK ") &&
      w.docks[req.slice(5)] && w.docks[req.slice(5)].sensor==="OCCUPIED";
    if (sensorAuto) return [];
    const opts = Object.values(w.docks).map(d => ["DOCK "+d.id, "Dock "+d.id +
        (d.state==="HELD" && d.holder!==c.t.id ? " (held for another)" : "")])
      .concat(Object.values(w.spots).map(s => ["SPOT "+s.id, "Spot "+s.id +
        (s.occupants.length ? " (occupied)" : "")]))
      .concat(Object.values(w.lots).map(l => ["LOT "+l.id,
        (l.inside_fence?"Inside lot":"Outside lot")+" — always available"]));
    return [{k:"actual", label:"Where did it actually go? (required — there is no “moved, location unknown”)",
      type:"select", options:opts, def:req}];
  },
  apply(w,c,vals){
    const t = c.t, m = openMove(w,t.id);
    let actual = vals.actual;
    if (!actual){ actual = m.requested_destination; log("sys","Dock sensor confirmed occupancy — no manual report needed (§2.9)."); }
    m.state = "COMPLETED"; m.actual_destination = actual;
    const wasOutside = t.lot && w.lots[t.lot] && !w.lots[t.lot].inside_fence;
    placeAt(w,t,actual);
    t.last_variance = !!(m.requested_destination && actual!==m.requested_destination);
    if (t.last_variance) log("dev","<b>PLACEMENT_VARIANCE</b> — asked for "+
      m.requested_destination+", reported "+actual+". A normal reported outcome, not an exception.");
    log("act","<b>COMPLETE_MOVE</b> — <b>position → "+actual+"</b>.");
    if (t.position==="DOCK"){
      const a = heldAssign(w,t.id);
      if (a && a.dock===t.dock){ a.state = "FULFILLED"; log("sys","<b>DockAssignment → FULFILLED</b>."); }
      t.stay = {dock:t.dock, opened_at:w.clock};
      if (sensorsLive(w)) w.docks[t.dock].sensor = "OCCUPIED";
      w.docks[t.dock].state = "OCCUPIED"; w.docks[t.dock].holder = t.id;
    }
    const nowInside = !(t.lot && !w.lots[t.lot].inside_fence);
    if (wasOutside && nowInside){
      const v = visitOfTrailer(w,t.id);
      if (v){ v.presence = "ON_SITE"; if (v.on_site_since==null) v.on_site_since = w.clock;
        log("sys","The move crossed the fence — <b>presence → ON_SITE</b>, presence clock started."); }
      else log("dev","The move crossed the fence, but this trailer has no visit — so there is no "+
        "<b>presence</b> to change. Finding F8.");
    }
  }
},

CANCEL_MOVE:{
  label:"Cancel move", on:"trailer", actor:"Dispatcher", ref:"model §5.2",
  gate(w,c){
    const m = c.t && openMove(w,c.t.id);
    if (!m) return [H(CLS.STRUCTURAL,"No open move task")];
    return [];
  },
  form(w,c){
    const m = openMove(w,c.t.id);
    if (m.state!=="IN_PROGRESS") return [];
    return [{k:"actual", label:"Reported location (the trailer is in motion)", type:"select",
      options: Object.values(w.spots).map(s => ["SPOT "+s.id,"Spot "+s.id])
        .concat(Object.values(w.lots).map(l => ["LOT "+l.id, l.inside_fence?"Inside lot":"Outside lot"]))
        .concat([["DOCK "+(m.origin==="DOCK"?"":"")+"", "Back at origin"]].filter(x=>false))}];
  },
  apply(w,c,vals){
    const t = c.t, m = openMove(w,t.id);
    m.state = "CANCELLED";
    if (t.position==="IN_MOTION") placeAt(w,t, vals.actual || "LOT OUTSIDE");
    log("act","<b>CANCEL_MOVE</b> — abandoned; reservations released.");
  }
},

/* ---------------- 5.3 Dock --------------------------------------------- */
OPEN_SESSION:{
  label:"Open session", on:"trailer", actor:"Dock lead", ref:"model §5.3 (§9 #37)",
  gate(w,c){
    const t = c.t;
    if (!t) return [H(CLS.STRUCTURAL,"No trailer in context")];
    if (t.position!=="DOCK") return [H(CLS.PHYSICAL,"Not at a dock")];
    if (openSession(w,t.id)) return [H(CLS.STRUCTURAL,"A session is already open on this stay")];
    const rows = rowsOf(w,t.id);
    const eligible = rows.filter(r =>
      (r.direction==="INBOUND" && r.link_state==="ON_BOARD") ||
      (r.direction==="OUTBOUND" && ["ASSIGNED","PART_LOADED"].includes(r.link_state)));
    if (!eligible.length) return [H(CLS.DATA,"Nothing aboard or assigned to work")];
    return svc(w,t);
  },
  apply(w,c){
    const t = c.t;
    const rows = rowsOf(w,t.id);
    const inbound = rows.filter(r => r.direction==="INBOUND" && r.link_state==="ON_BOARD");
    const outbound = rows.filter(r => r.direction==="OUTBOUND" &&
      ["ASSIGNED","PART_LOADED"].includes(r.link_state));
    const dir = inbound.length ? "UNLOAD" : "LOAD";
    const set = (dir==="UNLOAD" ? inbound : outbound);
    const s = {id:"S"+(w.seq++), trailer_id:t.id, dock:t.dock, direction:dir, state:"OPEN",
      shipments:set.map(r => ({shipment_id:r.shipment_id, joined_at:w.clock, outcome:null})),
      at:w.clock};
    w.sessions.push(s);
    log("act","<b>OPEN_SESSION</b> ("+dir+") — <b>pre-populated</b> with "+set.length+
      " shipment"+(set.length===1?"":"s")+". Remove what stays aboard rather than adding what to work.");
  }
},

ADD_SHIPMENT_TO_SESSION:{
  label:"Add shipment to session", on:"trailer", actor:"Dock lead",
  ref:"model §5.3 — exception path (§9 #17)",
  gate(w,c){
    const s = c.t && openSession(w,c.t.id);
    if (!s) return [H(CLS.STRUCTURAL,"No open session")];
    if (s.state==="ACTIVE" && !w.config.allow_add_shipment_to_active_session)
      return [D(CLS.PHYSICAL, WHY.SESSION_ACTIVE)];
    const cand = candidatesFor(w,c.t,s);
    if (!cand.length) return [H(CLS.DATA,"No eligible shipment outside the set")];
    return [];
  },
  form(w,c){
    const s = openSession(w,c.t.id);
    return [{k:"sh", label:"Shipment", type:"select",
      options: candidatesFor(w,c.t,s).map(r => [r.shipment_id,
        r.shipment_id+" · "+r.direction.toLowerCase()])}];
  },
  apply(w,c,vals){
    const s = openSession(w,c.t.id);
    s.shipments.push({shipment_id:vals.sh, joined_at:w.clock, outcome:null});
    log("act","<b>ADD_SHIPMENT_TO_SESSION</b> — "+vals.sh+" joined at "+hhmm(w.clock)+
      ". Its elapsed time runs from <b>joined_at</b>, not session start.");
  }
},

REMOVE_SHIPMENT_FROM_SESSION:{
  label:"Remove shipment from session", on:"trailer", actor:"Dock lead", ref:"model §5.3",
  gate(w,c){
    const s = c.t && openSession(w,c.t.id);
    if (!s) return [H(CLS.STRUCTURAL,"No open session")];
    if (s.state!=="OPEN") return [H(CLS.PHYSICAL,"Work has started")];
    if (s.shipments.length<1) return [H(CLS.STRUCTURAL,"Nothing in the set")];
    return [];
  },
  form(w,c){
    const s = openSession(w,c.t.id);
    return [{k:"sh", label:"Shipment staying aboard", type:"select",
      options: s.shipments.map(x => [x.shipment_id, x.shipment_id])}];
  },
  apply(w,c,vals){
    const s = openSession(w,c.t.id);
    s.shipments = s.shipments.filter(x => x.shipment_id!==vals.sh);
    log("act","<b>REMOVE_SHIPMENT_FROM_SESSION</b> — "+vals.sh+" excluded; it stays <b>ON_BOARD</b>.");
    const v = visitOfTrailer(w,c.t.id);
    const tl = v && takeLeg(w,v);
    if (s.direction==="UNLOAD" && tl){
      tl.expected_residual_shipment_ids = (tl.expected_residual_shipment_ids||[]).concat([vals.sh]);
      log("sys","Added to the TAKE leg's <b>expected_residual_shipment_ids</b> — this is what makes "+
        "the LTL departure a <b>PARTIAL_RECEIPT</b> rather than a discrepancy (§2.5).");
    } else if (s.direction==="UNLOAD"){
      log("dev","No TAKE leg to offer the residual list to. The freight stays aboard with nothing "+
        "declaring it expected — <b>UNEXPECTED_RESIDUAL</b> at the next authorization.");
    }
  }
},

START_SESSION:{
  label:"Start session", on:"trailer", actor:"Dock crew", ref:"model §5.3",
  gate(w,c){
    const s = c.t && openSession(w,c.t.id);
    if (!s) return [H(CLS.STRUCTURAL,"No open session")];
    if (s.state!=="OPEN") return [H(CLS.STRUCTURAL,"Already started")];
    if (!s.shipments.length) return [D(CLS.DATA, WHY.NO_SHIPMENT_IN_SESSION)];
    return [];
  },
  apply(w,c){
    const s = openSession(w,c.t.id);
    s.state = "ACTIVE"; s.started_at = w.clock;
    s.shipments.forEach(x => {
      const r = w.loads.find(r => r.trailer_id===c.t.id && r.shipment_id===x.shipment_id);
      r.link_state = s.direction==="LOAD" ? "LOADING" : "UNLOADING";
      w.shipments[x.shipment_id].status = s.direction==="LOAD" ? "LOADING" : "UNLOADING";
    });
    log("act","<b>START_SESSION</b> — rows → <b>"+(s.direction==="LOAD"?"LOADING":"UNLOADING")+
      "</b>; load state <b>IN_WORK</b>.");
  }
},

END_SESSION:{
  label:"End session", on:"trailer", actor:"Dock lead",
  ref:"model §5.3 — a reconciliation, not a button",
  gate(w,c){
    const s = c.t && openSession(w,c.t.id);
    if (!s) return [H(CLS.STRUCTURAL,"No session to end")];
    if (s.state!=="ACTIVE") return [H(CLS.PHYSICAL,"Work has not started")];
    return [];
  },
  reconcile:true,
  apply(w,c,vals){
    const s = openSession(w,c.t.id), t = c.t;
    s.state = "ENDED"; s.ended_at = w.clock;
    let closed = 0;
    s.shipments.forEach(x => {
      const out = vals[x.shipment_id];
      x.outcome = out;
      const r = w.loads.find(r => r.trailer_id===t.id && r.shipment_id===x.shipment_id);
      const sh = w.shipments[x.shipment_id];
      if (out==="LOADED"){ r.link_state = "ON_BOARD"; sh.status = "LOADED"; }
      else if (out==="NOT_LOADED"){
        /* the outcome vocabulary is direction-blind, but an inbound row has no
           ASSIGNED phase (glossary §5.2) — untouched inbound freight is aboard. */
        if (r.direction==="INBOUND"){ r.link_state = "ON_BOARD"; sh.status = "ARRIVED"; }
        else { r.link_state = "ASSIGNED"; sh.status = "ASSIGNED"; }
      }
      else if (out==="PARTIAL"){ r.link_state = "PART_LOADED"; sh.status = "LOADING"; }
      else if (out==="UNLOADED"){ w.loads = w.loads.filter(z => z!==r); sh.status = "RECEIVED"; closed++; }
    });
    const outcomes = s.shipments.map(x => x.shipment_id+" → "+x.outcome).join(", ");
    log("act","<b>END_SESSION</b> — per-shipment outcomes recorded: "+outcomes+
      ". The event log is the only durable record of this.");
    if (!rowsOf(w,t.id).length){
      t.empty_verification = "VERIFIED_EMPTY";
      log("sys","No rows remain — <b>empty_verification → VERIFIED_EMPTY</b>.");
    }
    if (s.shipments.some(x => x.outcome==="PARTIAL"))
      log("dev","<b>PART_LOAD_HELD</b> — a part-loaded row now blocks fill-complete, sealing and departure.");
  }
},

CANCEL_SESSION:{
  label:"Cancel session", on:"trailer", actor:"Dock lead / supervisor", ref:"model §5.3 (§9 #14)",
  gate(w,c){
    const s = c.t && openSession(w,c.t.id);
    if (!s) return [H(CLS.STRUCTURAL,"No open session")];
    if (s.state==="ACTIVE") return needRole(w, SUP);
    return [];
  },
  reconcileIfActive:true,
  apply(w,c,vals){
    const s = openSession(w,c.t.id);
    const wasActive = s.state==="ACTIVE";
    s.state = "CANCELLED";
    if (wasActive){
      s.shipments.forEach(x => {
        const out = vals[x.shipment_id] || "NOT_LOADED";
        x.outcome = out;
        const r = w.loads.find(r => r.trailer_id===c.t.id && r.shipment_id===x.shipment_id);
        const sh = w.shipments[x.shipment_id];
        if (out==="LOADED"){ r.link_state="ON_BOARD"; sh.status="LOADED"; }
        else if (out==="PARTIAL"){ r.link_state="PART_LOADED"; sh.status="LOADING"; }
        else if (out==="UNLOADED"){ w.loads = w.loads.filter(z=>z!==r); sh.status="RECEIVED"; }
        else { r.link_state = s.direction==="LOAD" ? "ASSIGNED" : "ON_BOARD";
               sh.status = s.direction==="LOAD" ? "ASSIGNED" : "ARRIVED"; }
      });
    }
    log("act","<b>CANCEL_SESSION</b> — same per-shipment reconciliation as END_SESSION; reason code required.");
  }
},

DECLARE_FILL_COMPLETE:{
  label:"Declare fill complete", on:"trailer", actor:"Dock lead (role-gated)",
  ref:"model §5.3 (§9 #13)",
  gate(w,c){
    const t = c.t;
    if (!t) return [H(CLS.STRUCTURAL,"No trailer in context")];
    if (t.fill==="COMPLETE") return [H(CLS.STRUCTURAL,"Already declared complete")];
    if (!hasFreight(w,t.id)) return [H(CLS.DATA,"No freight aboard — not a candidate")];
    const f = svc(w,t);
    const s = openSession(w,t.id);
    if (s) f.push(D(CLS.PHYSICAL, s.state==="ACTIVE" ? WHY.SESSION_ACTIVE : WHY.SESSION_OPEN));
    if (rowsOf(w,t.id).some(r => r.link_state==="PART_LOADED")) f.push(D(CLS.DATA, WHY.PART_LOADED));
    f.push(...needRole(w, w.config.roles_can_declare_fill_complete));
    return f;
  },
  apply(w,c){
    c.t.fill = "COMPLETE";
    log("act","<b>DECLARE_FILL_COMPLETE</b> — <b>fill_declaration → COMPLETE</b>. Gates sealing and departure.");
  }
},

REOPEN_FILL:{
  label:"Reopen fill", on:"trailer", actor:"Dock lead", ref:"model §5.3",

PULL_FROM_DOCK:{

/* ---------------- 5.4 Shipment ----------------------------------------- */
ASSIGN_SHIPMENT:{
  label:"Assign shipment", on:"trailer", actor:"Planner",
  ref:"model §5.4 — exception path (§9 #37)",
  gate(w,c){
    const t = c.t;
    if (!t) return [H(CLS.STRUCTURAL,"No trailer in context")];
    const rows = rowsOf(w,t.id);
    if (rows.some(r => r.direction==="INBOUND"))
      return [H(CLS.STRUCTURAL,"Trailer holds inbound freight")];   /* matrix §1.1: hidden */
    if (t.position==="OFF_SITE") return [H(CLS.PHYSICAL,"Trailer is not on site")];
    if (t.position==="IN_MOTION") return [H(CLS.PHYSICAL,"Trailer is in motion")];
    const v = c.v;
    if (v && ["AT_FACILITY","AT_GATE"].includes(v.presence))
      return [H(CLS.PHYSICAL,"At the facility but not through the gate")];
    if (t.intake==="AWAITING_INTAKE") return [D(CLS.DATA,"Take the trailer in first")];
    const f = svc(w,t);
    if (t.fill==="COMPLETE") f.push(D(CLS.DATA, WHY.FILL_COMPLETE));
    if (t.empty_verification==="UNVERIFIED") f.push(D(CLS.DATA, WHY.UNVERIFIED));
    if (w.config.require_readiness_before_assignment && readinessLive(w) && t.readiness!=="READY")
      f.push(D(CLS.DATA,"Readiness requirements outstanding"));
    const free = Object.values(w.shipments).filter(s =>
      s.direction==="OUTBOUND" && s.status==="PLANNED" &&
      !w.loads.some(r => r.shipment_id===s.id));
    if (!free.length) f.push(H(CLS.DATA,"No unassigned outbound shipment exists"));
    return f;
  },
  form(w){
    const free = Object.values(w.shipments).filter(s =>
      s.direction==="OUTBOUND" && s.status==="PLANNED" && !w.loads.some(r => r.shipment_id===s.id));
    return [{k:"sh", label:"Shipment", type:"select",
      options: free.map(s => [s.id, s.id+" · "+s.consignee])}];
  },
  apply(w,c,vals){
    mkLoad(w, vals.sh, c.t.id, "ASSIGNED");
    w.shipments[vals.sh].status = "ASSIGNED";
    log("act","<b>ASSIGN_SHIPMENT</b> — row created <b>ASSIGNED</b> for "+vals.sh+".");
    if (c.t.empty_verification==="CLAIMED_EMPTY")
      log("dev","<b>UNVERIFIED_ASSIGNMENT</b> — assigned on a driver's claim, never physically checked (§9 #6).");
  }
},

UNASSIGN_SHIPMENT:{
  label:"Unassign shipment", on:"trailer", actor:"Planner", ref:"model §5.4 (§9 #5)",
  gate(w,c){
    if (!c.t) return [H(CLS.STRUCTURAL,"No trailer in context")];
    const rows = rowsOf(w,c.t.id).filter(r => r.link_state==="ASSIGNED");
    if (!rows.length) return [H(CLS.STRUCTURAL,"Nothing is unassignable")];
    const s = openSession(w,c.t.id);
    if (s && s.state==="ACTIVE") return [D(CLS.PHYSICAL, WHY.SESSION_ACTIVE)];
    return [];

  form(w,c){
    return [{k:"sh", label:"Shipment", type:"select",

  },
  apply(w,c,vals){
    w.loads = w.loads.filter(r => !(r.trailer_id===c.t.id && r.shipment_id===vals.sh));
    w.shipments[vals.sh].status = "PLANNED";
    log("act","<b>UNASSIGN_SHIPMENT</b> — row deleted; "+vals.sh+" back to <b>PLANNED</b>.");
  }
},

SEAL_TRAILER:{
  label:"Seal trailer", on:"trailer", actor:"Dock lead", ref:"model §5.4",
  gate(w,c){
    const t = c.t;
    if (!t) return [H(CLS.STRUCTURAL,"No trailer in context")];
    if (t.sealed) return [H(CLS.STRUCTURAL,"Already sealed")];
    if (!rowsOf(w,t.id).some(r => r.link_state==="ON_BOARD"))
      return [H(CLS.DATA,"No freight aboard — not a sealing candidate")];
    const f = svc(w,t);
    if (t.fill!=="COMPLETE") f.push(D(CLS.DATA, WHY.FILL_OPEN));
    if (rowsOf(w,t.id).some(r => r.link_state==="PART_LOADED")) f.push(D(CLS.DATA, WHY.PART_LOADED));
    const s = openSession(w,t.id);
    if (s && s.state==="ACTIVE") f.push(D(CLS.PHYSICAL, WHY.SESSION_ACTIVE));
    return f;
  },
  apply(w,c){
    const t = c.t;
    t.sealed = true; t.seal = "SL" + (400000 + Math.floor(Math.random()*99999));
    rowsOf(w,t.id).filter(r => r.direction==="OUTBOUND" && r.link_state==="ON_BOARD")
      .forEach(r => { w.shipments[r.shipment_id].status = "STAGED"; });
    if (t.staged_since==null) t.staged_since = w.clock;
    log("act","<b>SEAL_TRAILER</b> — seal "+t.seal+" recorded; outbound shipments <b>STAGED</b>.");
  }

/* ---------------- 5.5 Corrections — supervisor, reason-coded ----------- */
CORRECT_TRAILER_IDENTITY:{
  label:"Correct trailer identity", on:"trailer", actor:"Supervisor", tier:"sup", ref:"model §5.5",

    const f = [];
    if ((s && s.state==="ACTIVE") || working) f.push(D(CLS.PHYSICAL, WHY.RENUMBER));
    f.push(...needRole(w, SUP));
    return f;
  },
  form(w,c){ return [{k:"number", label:"Correct trailer number", type:"text", def:c.t.number}]; },
  apply(w,c,vals){
    const old = c.t.number;
    c.t.number = vals.number;
    log("act","<b>CORRECT_TRAILER_IDENTITY</b> — renumbered "+old+" → "+vals.number+
      ". Logged against both numbers.");
  }
},

MERGE_TRAILERS:{
  label:"Merge duplicate records", on:"trailer", actor:"Supervisor", tier:"sup", ref:"model §5.5",
  gate(w,c){
    if (!c.t) return [H(CLS.STRUCTURAL,"No trailer in context")];
    const dupes = Object.values(w.trailers).filter(t =>
      t.id!==c.t.id && t.number===c.t.number);
    if (!dupes.length) return [H(CLS.STRUCTURAL,"No duplicate record for this number")];
    const bothHere = dupes.filter(t => onSite(t)).length && onSite(c.t);
    const f = [];
    if (bothHere) f.push(D(CLS.PHYSICAL,"Both records are on site — at most one may be"));

    dup.retired_into = c.t.id;
    w.loads.filter(r => r.trailer_id===dup.id).forEach(r => { r.trailer_id = c.t.id; });
    log("act","<b>MERGE_TRAILERS</b> — "+dup.id+" retired into "+c.t.id+
      ", never deleted. Its events legitimately happened.");
  }
},

CORRECT_DEPARTURE:{
  label:"Correct departure", on:"visit", actor:"Supervisor", tier:"sup", ref:"model §5.5",
  gate(w,c){
    const bad = w.idents.find(i => i.kind==="EXIT" && i.unresolved && i.outcome==="UNDECLARED");
    if (!bad) return [H(CLS.STRUCTURAL,"No departure is in dispute")];
    return needRole(w, SUP);
  },
  apply(w,c){
    const i = w.idents.find(x => x.kind==="EXIT" && x.unresolved && x.outcome==="UNDECLARED");
    const left = w.trailers[i.read_trailer], stayed = w.trailers[i.declared_trailer];
    i.unresolved = false; i.corrected = true;
    if (stayed){
      stayed.position = stayed.prior_position || "YARD_SPOT";
      stayed.spot = stayed.prior_spot || "B-07";
      if (stayed.spot && w.spots[stayed.spot]) w.spots[stayed.spot].occupants = [stayed.id];
      rowsOf(w,stayed.id).filter(r => r.direction==="OUTBOUND").forEach(r => {
        w.shipments[r.shipment_id].status = stayed.sealed ? "STAGED" : "LOADED";
      });
    }
    if (left){
      left.position = "OFF_SITE"; left.spot = null; left.dock = null;
      rowsOf(w,left.id).filter(r => r.direction==="OUTBOUND").forEach(r => {
        w.shipments[r.shipment_id].status = "DEPARTED";
      });
    }
    log("act","<b>CORRECT_DEPARTURE</b> — "+(left?left.number:"?")+" recorded as departed; "+
      (stayed?stayed.number:"?")+" restored to the yard with its <b>STAGED</b> preload intact. "+
      "The original check-out is retained and superseded, never overwritten.");
  }
},

ADJUST_STATE:{

/* ---- helpers the actions share ---------------------------------------- */
function log0(s){ /* deferred note during a gate evaluation — gates must not write */ }

function candidatesFor(w,t,s){
  return rowsOf(w,t.id).filter(r => {
    if (s.shipments.some(x => x.shipment_id===r.shipment_id)) return false;
    if (s.direction==="LOAD") return r.direction==="OUTBOUND" &&
      ["ASSIGNED","PART_LOADED"].includes(r.link_state);
    return r.direction==="INBOUND" && r.link_state==="ON_BOARD";
  });
}

function bindLeg(w, v, leg, number, source){
  const collision = Object.values(w.trailers).find(t =>
    t.number===number && onSite(t) && !t.retired_into);
  if (collision){
    log("dev","<b>Hard block</b> — "+number+" is already on site with an open visit. "+
      "No override: this is a typo or a check-out that never happened (§5.1).");
    return null;
  }
  let t = Object.values(w.trailers).find(x => x.number===number && !x.retired_into &&
    x.position==="OFF_SITE");
  if (!t){
    const near = Object.values(w.trailers).find(x => x.number!==number &&
      editDistance(x.number, number)===1);
    t = mkTrailer(w, {id:"T"+(w.seq++), number, carrier:leg.carrier||"SWIFT"});
    t.first_visit = true;
    if (near) log("dev","<b>Near-match warning</b> — "+number+" is one character from "+
      near.number+", seen here before. Offered before check-in completes (§5.1).");
    else log("sys","<b>FIRST_VISIT</b> — "+number+" has no history here. Genuinely new, or a mistyped number.");
  } else t.first_visit = false;
  leg.trailer_id = t.id;
  t.identity_confidence = "SINGLE_SOURCE";
  w.idents.push({kind:"ENTRY", read_trailer:null, declared_trailer:t.id, source,
    unresolved:false, at:w.clock});
  rowsFromLeg(w, leg, t);
  /* patterns 1 and 2 are the only ones where the same trailer appears on both
     legs (model §4) — the seed says so, and binding the BRING leg binds both,
     which is also where the TAKE leg's ASSIGNED rows come from. */
  if (leg.kind==="BRING") v.legs.filter(l => l.same_as_bring && !l.trailer_id)
    .forEach(l => { l.trailer_id = t.id; rowsFromLeg(w, l, t); });
  log("act","<b>BIND_TRAILER_TO_LEG</b> — "+leg.kind+" leg = <b>"+number+"</b> ("+source+").");
  return t;
}

/* The appointment is the single source of what is moving (§9 #37): binding the
   trailer is the moment the known shipments and the unknown trailer meet. */
function rowsFromLeg(w, leg, t){
  const ids = (leg.expected_shipment_ids||[]).filter(sid =>
    !w.loads.some(r => r.shipment_id===sid));
  if (!ids.length) return;
  ids.forEach(sid => mkLoad(w, sid, t.id, leg.kind==="BRING" ? "ON_BOARD" : "ASSIGNED"));
  log("sys", leg.kind==="BRING"
    ? "BRING leg rows created <b>ON_BOARD</b> — the freight is physically aboard already."
    : "TAKE leg rows created <b>ASSIGNED</b> — planned for this trailer, not yet loaded.");
  if (leg.kind==="TAKE" && t.empty_verification==="UNVERIFIED")
    log("dev","Outbound rows now exist on a trailer whose empty state is <b>UNVERIFIED</b>. "+
      "ASSIGN_SHIPMENT would have refused this (§9 #6); BIND_TRAILER_TO_LEG does not ask. "+
      "Finding F11.");
}

function editDistance(a,b){
  if (!a||!b) return 9;
  if (a.length!==b.length) return Math.abs(a.length-b.length)+1;
  let d = 0; for (let i=0;i<a.length;i++) if (a[i]!==b[i]) d++;
  return d;
}

function releasePosition(w,t){
  if (t.position==="YARD_SPOT" && t.spot && w.spots[t.spot])
    w.spots[t.spot].occupants = w.spots[t.spot].occupants.filter(x => x!==t.id);
  if (t.position==="DOCK" && t.dock && w.docks[t.dock] && w.docks[t.dock].holder===t.id){
    w.docks[t.dock].state = "FREE"; w.docks[t.dock].holder = null;
  }
  t.spot = null; t.dock = null; t.lot = null;
}

function placeAt(w,t,where){
  releasePosition(w,t);
  if (where.startsWith("DOCK ")){ t.position = "DOCK"; t.dock = where.slice(5); }
  else if (where.startsWith("SPOT ")){
    t.position = "YARD_SPOT"; t.spot = where.slice(5);
    const s = w.spots[t.spot];
    if (s){ s.occupants.push(t.id);
      if (s.occupants.length>1) log("dev","<b>SPOT_CONFLICT</b> — two trailers reported into "+
        s.id+". Both reports accepted, never refused (§2.9)."); }
  }
  else if (where.startsWith("LOT ")){ t.position = "LOT"; t.lot = where.slice(4); }
  else if (where==="YARD"){ t.position = "LOT"; t.lot = Object.keys(w.lots)[0]; }
  t.verified_by_check = false;
}
/* ===========================================================================
   PART 4 — WORLD EVENTS, TIERING, SCENARIOS

   World events are kept separate from actions on purpose: "a clerk did
   something" and "the world happened to you" are different kinds of fact, and
   half the exception branches in flows §11 are the second kind.
   ======================================================================== */

const WORLD = {

  apply(w){ w.clock += 45; log("sys","Clock → <b>"+hhmm(w.clock)+"</b>."); }
},
"@ENTRY_READ":{
  label:"Entry camera read lands", ref:"model §2.15 · §5.1",
  gate(w){ return camerasLive(w) ? [] :
    [H(CLS.STRUCTURAL,"No cameras at this facility — the near-match warning is the only soft control")]; },
  form(w){
    const here = Object.values(w.trailers).filter(t => onSite(t) || t.position==="AT_GATE_IN");
    return [{k:"read", label:"What the camera read", type:"select",
      options: here.map(t => [t.id, t.number+" (agrees with the guard)"])
        .concat([["__OFF_BY_ONE__","A number one digit off — the reads disagree"],

        unresolved:true, at:w.clock, mismatch:true});
      log("dev","<b>ID_DISPUTED</b> — camera and guard disagree. One is wrong and the data cannot "+
        "say which. Check-in proceeded provisionally so the gate did not stall.");
    } else if (vals.read==="__NO_CHECKIN__"){
      w.idents.push({kind:"ENTRY", read_trailer:t.id, declared_trailer:null, source:"CAMERA_AI",
        unresolved:true, at:w.clock, no_registration:true});

        "Not the typo-cleanup queue: an unauthorized entry and a dirty lens must not be triaged alike.");

      t.identity_confidence = "CORROBORATED";

  }

"@EXIT_READ":{
  label:"Exit camera read lands", ref:"model §5.1 — detective, not preventive",
  gate(w,c){
    if (!w.config.exit_identification_enabled)
      return [H(CLS.STRUCTURAL,"Exit reads are off — departure_time_source falls back to the clerk action")];
    const v = c.v;
    if (!v || v.presence!=="DEPARTED") return [H(CLS.PHYSICAL,"Nothing has departed yet")];
    if (v.exit_read_done) return [H(CLS.STRUCTURAL,"Exit read already resolved")];
    return [];
  },
  form(w,c){
    const v = c.v, tl = takeLeg(w,v);
    const declared = tl && tl.trailer_id;
    const opts = [];
    if (declared) opts.push([declared, w.trailers[declared].number+" — matches the declaration"]);
    else opts.push(["__NO_TRAILER__","NO_TRAILER — bobtail, a matched outcome"]);
    Object.values(w.trailers).filter(t => t.id!==declared && !t.retired_into)
      .forEach(t => opts.push([t.id, t.number+" — NOT what was declared"]));
    return [{k:"read", label:"What the exit camera saw", type:"select", options:opts,
      def: declared || "__NO_TRAILER__"}];

  apply(w,c,vals){
    const v = c.v, tl = takeLeg(w,v);
    const declared = tl && tl.trailer_id;
    v.exit_read_done = true;
    const capture = w.clock - 4;
    if (vals.read==="__NO_TRAILER__" || vals.read===declared){
      v.departed_at = capture;
      w.idents.push({kind:"EXIT", read_trailer:declared||null, declared_trailer:declared||null,
        source:"CAMERA_AI", unresolved:false, at:capture, outcome:"MATCHED"});
      log("sys","Exit read <b>matched</b>. Departure time backfilled from the image capture at "+
        hhmm(capture)+" — not the clerk's click. A class of billing dispute removed rather than recorded.");
    } else {
      const actual = w.trailers[vals.read];
      /* the trailer that actually left, and the one everyone thinks left */
      if (declared){
        const st = w.trailers[declared];
        st.prior_position = "YARD_SPOT"; st.prior_spot = st.spot || "B-07";
      }
      w.idents.push({kind:"EXIT", read_trailer:actual.id, declared_trailer:declared||null,
        source:"CAMERA_AI", unresolved:true, at:capture, outcome:"UNDECLARED"});
      log("dev","<b>UNDECLARED_TRAILER_EXIT</b> — the read says <b>"+actual.number+
        "</b> left, the declaration says <b>"+(declared?w.trailers[declared].number:"nothing")+
        "</b>. Check-out already completed. Recovery event raised; <b>RECOVERY_WINDOW_OPEN</b> "+
        "while the driver is still reachable — and it decays.");

/* ---- primary action, derived not configured (matrix §1.7) -------------- */
function primaryFor(w, ctx){
  const t = ctx.t, v = ctx.v;
  const avail = id => ACTIONS[id] && treat(ACTIONS[id].gate(w,ctx)).t==="A";
  const sess = t ? openSession(w,t.id) : null;
  const last = t ? lastSession(w,t.id) : null;
  const mv = t ? openMove(w,t.id) : null;
  const rows = t ? rowsOf(w,t.id) : [];

  if (t && t.position==="DOCK"){
    if (!sess && rows.some(r => r.link_state==="ASSIGNED" || r.link_state==="ON_BOARD")
        && avail("OPEN_SESSION")) return "OPEN_SESSION";
    if (sess && sess.state==="OPEN" && sess.shipments.length && avail("START_SESSION")) return "START_SESSION";
    if (sess && sess.state==="ACTIVE" && avail("END_SESSION")) return "END_SESSION";
    if (!sess && last && ["ENDED","CANCELLED"].includes(last.state)){
      if (avail("DECLARE_FILL_COMPLETE")) return "DECLARE_FILL_COMPLETE";
      if (avail("PULL_FROM_DOCK")) return "PULL_FROM_DOCK";
    }
    if (!sess && !rows.length && avail("ASSIGN_SHIPMENT")) return "ASSIGN_SHIPMENT";
  }
  if (t && (t.position==="YARD_SPOT"||t.position==="LOT") && hasFreight(w,t.id) &&
      t.fill==="COMPLETE" && !t.sealed && avail("SEAL_TRAILER")) return "SEAL_TRAILER";
  if (mv){
    if (mv.state==="PENDING" && avail("ASSIGN_MOVE_TASK")) return "ASSIGN_MOVE_TASK";
    if (mv.state==="ASSIGNED" && avail("START_MOVE")) return "START_MOVE";
    if (mv.state==="IN_PROGRESS" && avail("COMPLETE_MOVE")) return "COMPLETE_MOVE";
  }
  if (t && flagsOf(w,t.id).includes("NEEDS_MOVE") && avail("CREATE_MOVE_TASK")) return "CREATE_MOVE_TASK";
  if (t && t.tractor && t.destination!=="NONE" && !atDestination(w,t) && avail("DRIVER_POSITIONS"))
    return "DRIVER_POSITIONS";
  if (v && takeLeg(w,v) && takeLeg(w,v).trailer_id &&
      readyToDepart(w,v,takeLeg(w,v).trailer_id) && avail("AUTHORIZE_DEPARTURE"))
    return "AUTHORIZE_DEPARTURE";
  if (v && v.presence==="AUTHORIZED_TO_DEPART" && avail("CHECK_OUT")) return "CHECK_OUT";
  if (t && t.identity_confidence==="DISPUTED" && avail("RESOLVE_IDENTIFICATION"))
    return "RESOLVE_IDENTIFICATION";
  if (w.idents.some(i => i.kind==="EXIT" && i.unresolved && i.outcome==="UNDECLARED") &&
      avail("CORRECT_DEPARTURE")) return "CORRECT_DEPARTURE";
  if (v && avail("SELF_REGISTER")) return "SELF_REGISTER";
  if (v && avail("ADMIT")) return "ADMIT";
  if (t && t.destination==="AWAITING_ASSIGNMENT" && avail("ASSIGN_DOCK")) return "ASSIGN_DOCK";
  return null;
}

/* ---- assemble the console (matrix §1.5, §1.6) -------------------------- */
function buildConsole(w, ctx){
  const primary = primaryFor(w, ctx);
  const rows = [];
  Object.keys(ACTIONS).forEach(id => {
    const a = ACTIONS[id];
    const res = treat(a.gate(w,ctx));
    const mx = matrixSays(id, w, ctx);
    rows.push({id, a, res, primary:id===primary, sup:a.tier==="sup",
      diverges: mx && mx!==res.t ? mx : null});
  });
  const sup = rows.filter(r => r.sup && r.res.t!=="H");
  const supHidden = rows.filter(r => r.sup && r.res.t==="H");
  const nonSup = rows.filter(r => !r.sup);
  const prim = nonSup.filter(r => r.primary && r.res.t==="A");
  const availables = nonSup.filter(r => r.res.t==="A" && !r.primary);
  const disabled = nonSup.filter(r => r.res.t==="D")
    .sort((x,y) => Math.min(...x.a.gate(w,ctx).map(f=>f.cls)) -
                   Math.min(...y.a.gate(w,ctx).map(f=>f.cls)));
  const shownD = disabled.slice(0,3);         /* matrix §1.5 — cap of three */
  const moreD  = disabled.slice(3);
  const hidden = nonSup.filter(r => r.res.t==="H");
  return {prim, availables, shownD, moreD, hidden, sup, supHidden,
    world: Object.keys(WORLD).map(id => {
      const res = treat(WORLD[id].gate(w,ctx));
      return {id, a:WORLD[id], res, world:true};
    })};
}

const SEEDED = [

 refs:"matrix §2.1 · model §5.1 · flows §3 P1b"},
{id:"F2", sev:"contradiction", title:"SELF_REGISTER is hidden in every column it has",
 body:"Matrix §2.1 gives SELF_REGISTER four columns and marks it <b>H</b> in all four — impossible when OFF_SITE, already-registered everywhere else. There is no state in which the matrix makes it available, yet it is the first step of five of the seven flows. This is the same circularity the matrix records fixing in v0.3 (“CHECK_IN is what <i>causes</i> AT_GATE_IN, so the action was only available once its own effect had happened”), reappearing in a new form: the QR scan is what causes AT_FACILITY. The resolution is probably that the scan is an event, not a screen action — but then it does not belong in an action-availability matrix at all, and the action catalog should say so.",
 refs:"matrix §2.1 · matrix changelog v0.3 · model §5.1"},

 refs:"model §5.1 · model §6.1 · glossary §5.4 · flows §3 P5b"},
{id:"F4", sev:"contradiction", title:"TURN_AWAY's preconditions name two retired states",

const $  = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function ctxOf(w){
  let t = w.focusTrailer && w.trailers[w.focusTrailer];
  let v = w.focusVisit && w.visits[w.focusVisit];
  if (!t && v){
    const leg = v.legs.find(l => l.trailer_id);
    if (leg) t = w.trailers[leg.trailer_id];
  }
  if (!v && t) v = visitOfTrailer(w,t.id);
  if (!t) t = Object.values(w.trailers).filter(x => !x.retired_into)[0] || null;
  return {t, v, role:w.role};
}

/* ---- spine ------------------------------------------------------------- */
function renderSpine(){
  const used = SCEN ? SCEN.phases : [];
  const cur = currentStep();
  const nowPhase = cur ? cur.phase : null;
  const donePhases = new Set(SCEN ? SCEN.script.slice(0,CURSOR).map(s => s.phase) : []);
  $("#spine").innerHTML = PHASES.map(p => {
    const cls = ["ph"];
    if (!used.includes(p.k)) cls.push("skip");
    else if (p.k===nowPhase) cls.push("now");
    else if (donePhases.has(p.k)) cls.push("done");
    else cls.push("used");
    return '<div class="'+cls.join(" ")+'"><span class="k">'+p.k+' · '+esc(p.n)+
      '</span><span class="q">'+esc(p.q)+'</span></div>';
  }).join("");
  const skipped = PHASES.filter(p => !used.includes(p.k)).map(p => p.k);
  $("#spinenote").innerHTML = SCEN
    ? (skipped.length
        ? "This flow uses "+used.length+" of the six phases. "+skipped.join(", ")+
          " do not apply — struck through rather than hidden, because which phases a flow "+
          "<i>skips</i> is the fact that makes them one spine instead of seven pipelines."
        : "This flow uses every phase." )
    : "";
  $("#flowid").textContent = SCEN ? SCEN.id : "";
}

/* ---- actions ----------------------------------------------------------- */
function actChip(r, isNext){
  const a = r.a;
  const cls = ["act"];
  if (r.res.t==="A") cls.push(r.primary ? "p" : "");
  if (r.res.t==="D") cls.push("d");
  if (r.res.t==="H") cls.push("h");
  if (r.sup) cls.push("sup");
  if (isNext) cls.push("next");
  const dis = r.res.t!=="A" ? " disabled" : "";
  const div = r.diverges
    ? '<span class="aw" style="color:var(--bad)">matrix §2.1 says '+r.diverges+
      ', engine says '+r.res.t+'</span>' : "";
  return '<button type="button" class="'+cls.join(" ").trim()+'" data-act="'+r.id+'"'+dis+'>' +
    '<span class="an">'+esc(a.label)+(a.engine?" · ENGINE":"")+'</span>' +
    (r.res.why ? '<span class="aw">'+esc(r.res.why)+'</span>' : '') + div + '</button>';
}

    const res = SCEN._results && SCEN._results[i];
    const cls = ["step"];
    if (i===CURSOR) cls.push("now");
    else if (i<CURSOR) cls.push("past");
    if (res && res.status==="pass") cls.push("pass");
    if (res && res.status==="fail") cls.push("fail");
    const act = (ACTIONS[s.do]||WORLD[s.do]);
    const mk = res
      ? (res.status==="pass" ? (s.blocked ? "refused, as written" : "matches the doc")
                             : res.issues.join("; "))
      : (i===CURSOR ? (s.blocked ? "expects a refusal" : "you are here") : "");
    return '<div class="'+cls.join(" ")+'">' +
      '<span class="sid">'+esc(s.id)+'</span>' +
      '<span class="sy">'+esc(s.says)+'<br>' +
        '<span class="who">'+esc(s.actor)+' · '+idt(s.do)+
        (act && act.engine ? ' <b style="color:var(--bad)">ENGINE</b>' : '')+'</span> ' +
        '<span class="ref">'+esc(s.ref||"")+'</span></span>' +
      '<span class="mk">'+esc(mk)+'</span></div>';
  }).join("");
  const done = (SCEN._results||[]).filter(r => r && r.status==="pass").length;
  const bad  = (SCEN._results||[]).filter(r => r && r.status==="fail").length;
  $("#scriptstat").innerHTML = CURSOR>=SCEN.script.length
    ? "<b>Walked to the end.</b> "+done+" step"+(done===1?"":"s")+" matched the documents"+
      (bad ? ", "+bad+" did not" : "")+
      (DEVIATIONS.length ? " · "+DEVIATIONS.length+" off-script action"+
        (DEVIATIONS.length===1?"":"s") : "")
    : "Step "+(CURSOR+1)+" of "+SCEN.script.length+
      (bad ? " · "+bad+" mismatch"+(bad===1?"":"es") : "") +
      (DEVIATIONS.length ? " · "+DEVIATIONS.length+" off script" : "");
}

/* ---- rail right -------------------------------------------------------- */
function renderLog(){
  const rows = W.events.slice().reverse().map(e =>
    '<div class="ev '+(e.kind==="sys"?"sys":e.kind==="dev"?"dev":"")+'">' +
    '<span class="tm">'+hhmm(e.at)+'</span><span class="bo">'+e.body+'</span></div>');
  $("#log").innerHTML = rows.length ? rows.join("")
    : '<div class="ev sys"><span class="tm"></span><span class="bo">'+
      'The event log is the only durable record of what happened here. Nothing yet.</span></div>';
}
function findingCard(f){
  const sev = SEV[f.sev] || SEV.note;
  const vd = VERDICTS[f.id];
  return '<div class="find"><div class="fh">'+
    '<span class="fn">'+esc(f.title)+'</span>'+
    '<span class="bdg '+sev.t+'">'+esc(sev.l)+'</span></div>'+
    '<p class="fb">'+f.body+'</p>'+
    '<p class="fr">'+idt(f.id)+' · '+esc(f.refs||"")+
      (vd && vd.by ? ' · marked by '+esc(vd.by) : '')+'</p>'+
    '<div class="fa">'+
      '<button class="mini'+(vd&&vd.verdict==="real"?" on":"")+'" data-verdict="real" data-fid="'+
        f.id+'" type="button">Real</button>'+
      '<button class="mini'+(vd&&vd.verdict==="no"?" on":"")+'" data-verdict="no" data-fid="'+
        f.id+'" type="button">Not a problem</button>'+
      '<button class="mini'+(vd&&vd.verdict==="later"?" on":"")+'" data-verdict="later" data-fid="'+
        f.id+'" type="button">Decide later</button>'+
    '</div>'+
    (vd && vd.note ? '<p class="fb" style="color:var(--steel)"><b>Note:</b> '+esc(vd.note)+'</p>' : '')+
    '</div>';
}
function renderFindings(){
  const all = SEEDED.concat(NOTES);
  $("#findpane").innerHTML =
    '<div class="grp">From the build pass<i></i>'+SEEDED.length+'</div>' +
    SEEDED.map(findingCard).join("") +
    '<div class="grp">Yours<i></i>'+NOTES.length+'</div>' +
    (NOTES.length ? NOTES.map(findingCard).join("")
      : '<div class="find"><p class="fb" style="color:var(--mute)">Nothing yet. '+
        'Add one from wherever you are standing and it keeps the scenario, the step and '+
        'the state with it.</p></div>') +
    '<div class="find"><div class="fh"><span class="fn">Add a finding</span></div>' +
      '<textarea id="ftxt" placeholder="What is wrong, or what the documents do not answer."></textarea>' +
      '<div class="fa"><button class="mini" id="fadd" type="button">Record it</button>' +
      '<span class="fr" id="fstat"></span></div></div>' +
    (db ? '' : '<div class="find"><p class="fr">Findings are kept on the published page. '+
      'Here in the file they live only for this session.</p></div>');
}

/* ---- full render ------------------------------------------------------- */
function render(){
  renderRail(); renderSpine(); renderObjects(); renderActions(); renderSteps(); renderLog();
  renderFindings();
  $("#scenname").textContent = SCEN ? SCEN.name : "Scenario";
  $("#scenref").textContent  = SCEN ? SCEN.ref : "";
  $("#scendek").textContent  = SCEN ? SCEN.dek : "";
  $("#hidbtn").classList.toggle("on", SHOW_HIDDEN);
  $("#hidbtn").textContent = SHOW_HIDDEN ? "Hide hidden actions" : "Show hidden actions";
  const dv = DEVIATIONS.length ? '<div class="note">You are off the script — '+
    DEVIATIONS.length+' action'+(DEVIATIONS.length===1?"":"s")+
    ' the document does not list at that point: '+
    DEVIATIONS.map(d => idt(d)).join(", ")+'. That is allowed; the flow simply stops '+
    'predicting what comes next.</div>' : "";
  $("#scenwarn").innerHTML = dv;
}
/* ===========================================================================
   PART 7 — INTERACTION
   ======================================================================== */

function loadScenario(id, keepConfig){
  const s = SCENARIOS.find(x => x.id===id) || SCENARIOS[0];
  const cfg = keepConfig && W ? JSON.parse(JSON.stringify(W.config)) : defaultConfig();
  W = blankWorld(cfg);
  SCEN = s; CURSOR = 0; DEVIATIONS = [];
  s._results = [];
  s.seed(W);
  if (!W.role) W.role = "CLERK";
  buildRoleSelect();
  log("sys","Scenario <b>"+esc(s.name)+"</b> seeded. "+esc(s.ref)+".");
  render();
}

function buildRoleSelect(){
  $("#role").innerHTML = ROLES.map(r =>
    '<option value="'+r.id+'"'+(W.role===r.id?" selected":"")+'>'+esc(r.label)+'</option>').join("");
}

/* ---- generic prompt sheet --------------------------------------------- */
function openSheet(title, sub, bodyHtml, onOk, okLabel){
  const dlg = $("#sheet");
  dlg.innerHTML =
    '<header><h3>'+esc(title)+'</h3>'+(sub?'<p>'+sub+'</p>':'')+'</header>' +
    '<div class="fbd">'+bodyHtml+'</div>' +
    '<footer><button class="btn" type="button" data-x="cancel">Cancel</button>' +
    '<button class="btn p" type="button" data-x="ok">'+esc(okLabel||"Do it")+'</button></footer>';
  dlg.onclick = e => {
    const b = e.target.closest("[data-x]");
    if (!b) return;
    if (b.dataset.x==="cancel"){ dlg.close(); return; }
    const vals = {};
    dlg.querySelectorAll("[data-k]").forEach(el => {
      if (el.type==="radio"){ if (el.checked) vals[el.dataset.k] = el.value; }
      else vals[el.dataset.k] = el.value;
    });
    dlg.close();
    onOk(vals);
  };
  dlg.showModal();
  const first = dlg.querySelector("select,input[type=text]");
  if (first) first.focus();
}

function fieldHtml(f){
  if (f.type==="select")
    return '<label class="fld"><span>'+esc(f.label)+'</span><select data-k="'+f.k+'">' +
      f.options.map(([v,l]) => '<option value="'+esc(v)+'"'+
        (f.def===v?" selected":"")+'>'+esc(l)+'</option>').join("") + '</select></label>';
  return '<label class="fld"><span>'+esc(f.label)+'</span>' +
    '<input type="text" data-k="'+f.k+'" value="'+esc(f.def||"")+'"></label>';
}

/* ---- END_SESSION reconciliation --------------------------------------- */
const OUTCOMES = {
  LOAD:  [["LOADED","Loaded"],["NOT_LOADED","Nothing went on"],["PARTIAL","Part loaded"]],
  UNLOAD:[["UNLOADED","Unloaded"],["NOT_LOADED","Not touched"],["PARTIAL","Part unloaded"]]
};
function openReconcile(id, sess){
  const sup = W.role==="SUPERVISOR";
  const body =
    '<p class="fr" style="font-size:11.5px;color:var(--steel)">An outcome is required for '+
    'every shipment in the set — this is a reconciliation, not a confirmation dialog, and the '+
    'event log is the only durable record of it. '+
    (sup ? '' : '<b>PARTIAL</b> needs a supervisor; it is offered but locked.')+'</p>' +
    '<div class="recon">' + sess.shipments.map(x => {
      const sh = W.shipments[x.shipment_id];
      const joined = x.joined_at!==sess.at
        ? ' · joined '+hhmm(x.joined_at)+', timed from there' : '';
      return '<div class="rr"><span class="rn">'+esc(x.shipment_id)+
        ' <span style="font-weight:400;color:var(--steel);font-size:11.5px">'+
        esc(sh.consignee)+joined+'</span></span><span class="ro">' +
        OUTCOMES[sess.direction].map(([v,l]) => {
          const locked = v==="PARTIAL" && !sup;
          return '<label class="ochip'+(locked?" locked":"")+'">' +
            '<input type="radio" name="o_'+x.shipment_id+'" data-k="'+x.shipment_id+
            '" value="'+v+'"'+(locked?" disabled":"")+
            (v===OUTCOMES[sess.direction][0][0]?" checked":"")+'>'+esc(l)+'</label>';
        }).join("") + '</span></div>';
    }).join("") + '</div>';
  openSheet(ACTIONS[id].label, "Session "+idt(sess.id)+" · "+idt(sess.direction)+
    " at dock "+esc(sess.dock), body, vals => commit(id, vals), "Record outcomes");
}

/* ---- perform ----------------------------------------------------------- */
function performAction(id){
  const a = ACTIONS[id] || WORLD[id];
  if (!a) return;
  const c = ctxOf(W);
  if (treat(a.gate(W,c)).t!=="A") return;
  const sess = c.t ? openSession(W,c.t.id) : null;
  if (a.reconcile && sess) return openReconcile(id, sess);
  if (a.reconcileIfActive && sess && sess.state==="ACTIVE") return openReconcile(id, sess);
  const fields = a.form ? a.form(W,c) : [];
  if (!fields.length) return commit(id, {});
  openSheet(a.label, esc(a.ref||""), fields.map(fieldHtml).join(""),
    vals => commit(id, vals), a.tier==="sup" ? "Override" : "Do it");
}

function commit(id, vals){
  const a = ACTIONS[id] || WORLD[id];
  const c = ctxOf(W);
  if (a.supIf && a.supIf(W,c,vals) && W.role!=="SUPERVISOR"){
    log("dev","<b>Supervisor confirmation required</b> — a substitution involving loaded freight "+
      "names another party's freight. Switch role to Supervisor to continue (§5.1).");
    render(); return;
  }
  a.apply(W, c, vals||{});
  W.clock += 3;
  afterAction(id);
  render();
}

function afterAction(id){
  const cur = currentStep();
  if (!cur) return;
  if (cur.do===id){
    const issues = cur.check ? (cur.check(W)||[]) : [];
    SCEN._results[CURSOR] = {status: issues.length ? "fail" : "pass", issues};
    CURSOR++;
    /* skip past any step the document expects to be blocked and now is not needed */
    return;
  }
  DEVIATIONS.push(id);
}

/* Confirm a step the document expects to be refused, then move on. */
function confirmBlocked(){
  const cur = currentStep();
  if (!cur) return;
  const a = ACTIONS[cur.do] || WORLD[cur.do];
  const res = treat(a.gate(W, ctxOf(W)));
  const ok = res.t!=="A";
  SCEN._results[CURSOR] = {status: ok ? "pass" : "fail",
    issues: ok ? [] : ["the document expects this to be refused, and it is available"]};
  log(ok?"sys":"dev", ok
    ? "Confirmed refused: <b>"+cur.do+"</b> — "+esc(res.why||"")+" ("+res.t+")."
    : "<b>"+cur.do+"</b> should have been refused here and was not.");
  CURSOR++;
  render();
}
function skipStep(){
  if (!currentStep()) return;
  SCEN._results[CURSOR] = {status:"fail", issues:["skipped"]};
  CURSOR++;
  render();
}

/* ---- config sheet ----------------------------------------------------- */
function openConfig(){
  const dlg = $("#cfgsheet");
  dlg.innerHTML =
    '<header><h3>Facility configuration</h3>' +
    '<p>Capabilities generalize by defaulting, not by feature flags (model §1.2). ' +
    'Turn a dimension off here and it must vanish from every state, screen and prompt — ' +
    'not merely go unused. Changing anything re-seeds the scenario.</p></header>' +
    '<div class="fbd"><div class="cfg">' +
    CONFIG_KEYS.map(k => {
      const val = W.config[k.k];
      let ctl;
      if (k.kind==="flag")
        ctl = '<span class="sw"><input type="checkbox" id="cfg_'+k.k+'" data-cfg="'+k.k+
          '"'+(val?" checked":"")+'><i></i></span>';
      else if (k.kind==="list")
        ctl = '<select id="cfg_'+k.k+'" data-cfg="'+k.k+'">' + k.opts.map(([v,l]) =>
          '<option value="'+esc(v)+'"'+((val||[]).join(",")===v?" selected":"")+'>'+
          esc(l)+'</option>').join("") + '</select>';
      else
        ctl = '<select id="cfg_'+k.k+'" data-cfg="'+k.k+'">' + ROLES.map(r =>
          '<option value="'+r.id+'"'+((val||[]).includes(r.id)?" selected":"")+'>'+
          esc(r.label)+' and above</option>').join("") + '</select>';
      return '<div class="cfgrow"><span><span class="ck id">'+esc(k.k)+'</span>'+
        '<span class="cd">'+esc(k.d)+'</span></span>'+ctl+'</div>';
    }).join("") +
    '</div></div>' +
    '<footer><button class="btn p" type="button" data-close="1">Done</button></footer>';
  dlg.onclick = e => {
    if (e.target.closest("[data-close]")) dlg.close();
  };
  dlg.onchange = e => {
    const el = e.target.closest("[data-cfg]");
    if (!el) return;
    const k = CONFIG_KEYS.find(x => x.k===el.dataset.cfg);
    if (k.kind==="flag") W.config[k.k] = el.checked;
    else if (k.kind==="list") W.config[k.k] = el.value ? el.value.split(",") : [];
    else {
      const idx = ROLES.findIndex(r => r.id===el.value);
      W.config[k.k] = ROLES.slice(idx).map(r => r.id);
    }
    W.config._touched = true;
    const cfg = JSON.parse(JSON.stringify(W.config));
    const sid = SCEN.id;
    W = blankWorld(cfg); SCEN = SCENARIOS.find(s => s.id===sid);
    CURSOR = 0; DEVIATIONS = []; SCEN._results = [];
    SCEN.seed(W); if (!W.role) W.role = "CLERK";
    buildRoleSelect();
    log("sys","Config changed — <b>"+esc(k.k)+"</b>. Scenario re-seeded.");
    render();
    openConfig();
  };
  dlg.showModal();
}

/* ---- wiring ------------------------------------------------------------ */
document.addEventListener("click", e => {
  const sc = e.target.closest("[data-scen]");
  if (sc){ loadScenario(sc.dataset.scen, true); return; }
  const ac = e.target.closest("[data-act]");
  if (ac && !ac.disabled){ performAction(ac.dataset.act); return; }
  const ft = e.target.closest("[data-focust]");
  if (ft){ W.focusTrailer = ft.dataset.focust; W.focusVisit = null; render(); return; }
  const fv = e.target.closest("[data-focusv]");
  if (fv){ W.focusVisit = fv.dataset.focusv; W.focusTrailer = null; render(); return; }
  const vd = e.target.closest("[data-verdict]");
  if (vd){ setVerdict(vd.dataset.fid, vd.dataset.verdict); return; }
  if (e.target.id==="fadd"){ addFinding(); return; }
  if (e.target.id==="cfgbtn"){ openConfig(); return; }
  if (e.target.id==="hidbtn"){ SHOW_HIDDEN = !SHOW_HIDDEN; render(); return; }
  if (e.target.id==="resetbtn"){ loadScenario(SCEN.id, true); return; }
  if (e.target.id==="tab-log" || e.target.id==="tab-find"){
    const findOn = e.target.id==="tab-find";
    $("#tab-find").setAttribute("aria-selected", String(findOn));
    $("#tab-log").setAttribute("aria-selected", String(!findOn));
    $("#logpane").hidden = findOn; $("#findpane").hidden = !findOn;
    return;
  }
  if (e.target.id==="btn-blocked"){ confirmBlocked(); return; }
  if (e.target.id==="btn-skip"){ skipStep(); return; }
});
document.addEventListener("change", e => {
  if (e.target.id==="role"){ W.role = e.target.value; render(); }
});

/* ---- findings persistence --------------------------------------------- */
function setVerdict(fid, verdict){
  const prev = VERDICTS[fid];
  const v = {verdict: prev && prev.verdict===verdict ? null : verdict, at:new Date().toISOString()};
  if (!v.verdict) delete VERDICTS[fid]; else VERDICTS[fid] = v;
  renderFindings();
  if (db){
    const ref = db.doc("verdicts/"+fid);
    (v.verdict ? ref.set(v) : ref.delete()).catch(() => {
      log("sys","Could not save that verdict."); renderLog();
    });
  }
}
function addFinding(){
  const el = $("#ftxt");
  const text = (el && el.value || "").trim();
  if (!text){ $("#fstat").textContent = "Write something first."; return; }
  const first = text.split(/(?<=[.!?])\s/)[0];
  const rec = {
    sev:"note",
    title: first.length > 90 ? first.slice(0,88)+"…" : first,
    body: esc(text),
    refs: (SCEN ? SCEN.name : "") + (currentStep() ? " · step "+currentStep().id : "") +
      " · " + (W.focusTrailer||W.focusVisit||""),
    at: new Date().toISOString()
  };
  const id = "N" + Date.now().toString(36);
  NOTES.push(Object.assign({id}, rec));
  el.value = "";
  renderFindings();
  if (db) db.doc("notes/"+id).set(rec).catch(() => {
    log("sys","Kept locally — could not save that note."); renderLog(); });
  else { $("#fstat").textContent = "Kept for this session."; }
}

/* ---- boot -------------------------------------------------------------- */
loadScenario("F1", false);

/* Script controls live under the Script header once a scenario is loaded. */
(function addScriptControls(){
  const hdr = document.querySelector(".stage .panel:last-of-type > header");
  if (!hdr) return;
  const wrap = document.createElement("span");
  wrap.innerHTML = '<button class="mini" id="btn-blocked" type="button">Confirm refused</button> ' +
    '<button class="mini" id="btn-skip" type="button">Skip step</button>';
  hdr.appendChild(wrap);
})();

(async function connect(){
  try{
    const d = window.claude && await window.claude.use("db");
    if (!d) return;
    db = d;
    d.collection("verdicts").onSnapshot(snap => {
      VERDICTS = {};
      snap.docs.forEach(doc => { VERDICTS[doc.id] = doc.data(); });
      renderFindings();
    }, () => {});
    d.collection("notes").orderBy("at","asc").onSnapshot(snap => {
      NOTES = snap.docs.map(doc => Object.assign({id:doc.id}, doc.data()));
      renderFindings();
    }, () => {});
  }catch(err){ /* the page works alone */ }
})();





</script>
