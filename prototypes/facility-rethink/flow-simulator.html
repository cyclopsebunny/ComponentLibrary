<title>Yard Flow Bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
/* ===========================================================================
   Yard Flow Bench — an instrument for walking the yard & dock operations
   document set against itself.

   Palette is drawn from the yard rather than from the product: steel-biased
   neutrals, dock navy for controls, one safety yellow spent only on the step
   you are standing on. Deliberately NOT the myQ azure of the shipped console,
   so nobody mistakes this for a UX proposal.

   Typography carries glossary §1.1's distinction as a rule rather than a note:
   IBM Plex Mono is ALWAYS an internal identifier (AWAITING_ASSIGNMENT);
   Archivo is ALWAYS a displayed label ("Awaiting Dock"). If a string is set
   in the wrong face, that is a bug in the copy, not the CSS.
   ======================================================================== */
:root{
  --ground:#FFFFFF;
  --surface:#F1F4F7;
  --surface-2:#E5EBF0;
  --surface-3:#D8E1E8;
  --line:#C7D1DA;
  --line-2:#A3B2BF;
  --ink:#0F1419;
  --ink-2:#38464F;
  --steel:#66788A;
  --mute:#8494A1;
  --accent:#B58200;        /* safety yellow, darkened to carry on white */
  --accent-bright:#E8B21C; /* the stripe itself */
  --accent-bg:#FDF3D8;
  --nav:#17384D;           /* dock navy */
  --nav-hover:#0D2635;
  --nav-ink:#FFFFFF;
  --ok:#186B37;  --ok-bg:#E2F0E7;  --ok-line:#4E9A6C;
  --warn:#7E4B00;--warn-bg:#FAEEDA;--warn-line:#C08A2E;
  --bad:#9E2A12; --bad-bg:#F9E2DD; --bad-line:#C8654D;
  --info:#0F5878;--info-bg:#DFEDF4;--info-line:#5C93AC;
  --shadow:0 1px 2px rgba(15,20,25,.05), 0 10px 26px -16px rgba(15,20,25,.28);
  --rail-l:266px;
  --rail-r:312px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1419;
    --surface:#161E26;
    --surface-2:#1D2832;
    --surface-3:#26333F;
    --line:#2B3945;
    --line-2:#41525F;
    --ink:#E8EFF4;
    --ink-2:#C2CFD9;
    --steel:#90A3B2;
    --mute:#77899A;
    --accent:#F0BE2E;
    --accent-bright:#F5C400;
    --accent-bg:#2E2205;
    --nav:#BBD8EC;
    --nav-hover:#D6E9F6;
    --nav-ink:#0B1318;
    --ok:#74CE97;  --ok-bg:#11301F;  --ok-line:#2F6B47;
    --warn:#EEC078;--warn-bg:#32220A;--warn-line:#7B571B;
    --bad:#F09C85; --bad-bg:#361711; --bad-line:#7E3827;
    --info:#8EC6E2;--info-bg:#102835;--info-line:#33627C;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -18px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#0E1419;
  --surface:#161E26;
  --surface-2:#1D2832;
  --surface-3:#26333F;
  --line:#2B3945;
  --line-2:#41525F;
  --ink:#E8EFF4;
  --ink-2:#C2CFD9;
  --steel:#90A3B2;
  --mute:#77899A;
  --accent:#F0BE2E;
  --accent-bright:#F5C400;
  --accent-bg:#2E2205;
  --nav:#BBD8EC;
  --nav-hover:#D6E9F6;
  --nav-ink:#0B1318;
  --ok:#74CE97;  --ok-bg:#11301F;  --ok-line:#2F6B47;
  --warn:#EEC078;--warn-bg:#32220A;--warn-line:#7B571B;
  --bad:#F09C85; --bad-bg:#361711; --bad-line:#7E3827;
  --info:#8EC6E2;--info-bg:#102835;--info-line:#33627C;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -18px rgba(0,0,0,.7);
}

*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:Archivo,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  font-size:14px; line-height:1.5; -webkit-text-size-adjust:100%;
}
/* Identifiers. Never a displayed label. */
.id{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  font-variant-numeric:tabular-nums; letter-spacing:-.01em}
h1,h2,h3{margin:0; text-wrap:balance; letter-spacing:-.015em}
p{margin:0}
button{font-family:inherit; font-size:inherit; color:inherit}
:where(button,select,input,a,[tabindex]):focus-visible{
  outline:2px solid var(--accent-bright); outline-offset:2px; border-radius:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}

/* ---- masthead ---------------------------------------------------------- */
.top{
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  padding:12px 20px; background:var(--surface); border-bottom:1px solid var(--line);
}
.brand{display:flex; flex-direction:column; gap:1px; margin-right:auto; min-width:0}
.brand b{font-size:16px; font-weight:700; letter-spacing:-.02em}
.brand span{font-size:11.5px; color:var(--steel)}
.topctl{display:flex; align-items:center; gap:7px; flex-wrap:wrap}
.topctl label{font-size:10.5px; font-weight:600; letter-spacing:.1em;
  text-transform:uppercase; color:var(--mute)}
select,input[type=text]{
  appearance:none; background:var(--ground); color:var(--ink);
  border:1px solid var(--line-2); border-radius:4px; padding:5px 9px; font-size:13px;
  font-family:inherit; max-width:100%;
}
select{padding-right:22px;
  background-image:linear-gradient(45deg,transparent 48%,currentColor 48% 52%,transparent 52%),
    linear-gradient(-45deg,transparent 48%,currentColor 48% 52%,transparent 52%);
  background-size:5px 5px,5px 5px; background-position:right 11px center,right 7px center;
  background-repeat:no-repeat}

/* ---- shell ------------------------------------------------------------- */
.shell{display:grid; grid-template-columns:var(--rail-l) minmax(0,1fr) var(--rail-r);
  align-items:start; min-height:calc(100vh - 54px)}
.rail{border-right:1px solid var(--line); background:var(--surface);
  padding:0 0 24px; min-width:0}
.rail.r{border-right:0; border-left:1px solid var(--line)}
.stage{min-width:0; padding:18px 22px 40px; display:flex; flex-direction:column; gap:16px}
@media (min-width:1100px){
  .shell{height:calc(100vh - 54px); overflow:hidden}
  .rail,.stage{height:100%; overflow-y:auto; scrollbar-width:thin}
}
@media (max-width:1099px){
  .shell{display:flex; flex-direction:column; height:auto}
  .rail,.rail.r{border:0; border-bottom:1px solid var(--line); width:100%}
  .stage{padding:16px}
}

/* ---- rail furniture ---------------------------------------------------- */
.grp{padding:14px 14px 6px; font-size:10.5px; font-weight:600; letter-spacing:.12em;
  text-transform:uppercase; color:var(--mute); display:flex; align-items:baseline; gap:7px}
.grp i{flex:1; height:1px; background:var(--line); font-style:normal}
.scen{display:block; width:100%; text-align:left; background:none; border:0;
  border-left:3px solid transparent; padding:7px 14px 8px 11px; cursor:pointer}
.scen:hover{background:var(--surface-2)}
.scen[aria-current="true"]{background:var(--ground); border-left-color:var(--accent-bright)}
.scen .nm{font-size:13px; font-weight:600; display:block; line-height:1.3}
.scen .sb{font-size:11px; color:var(--steel); display:block; margin-top:1px}
.scen[aria-current="true"] .nm{color:var(--ink)}

/* ---- panels ------------------------------------------------------------ */
.panel{border:1px solid var(--line); border-radius:6px; background:var(--ground);
  display:flex; flex-direction:column; min-width:0}
.panel>header{display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:9px 13px; border-bottom:1px solid var(--line); background:var(--surface)}
.panel>header h2{font-size:10.5px; font-weight:600; letter-spacing:.12em;
  text-transform:uppercase; color:var(--steel); margin-right:auto}
.panel>.bd{padding:13px; display:flex; flex-direction:column; gap:12px; min-width:0}
.panel.flat{border-radius:6px; box-shadow:var(--shadow)}

/* ---- the six-phase spine ---------------------------------------------- */
.spine{display:flex; align-items:stretch; gap:3px; overflow-x:auto; padding:2px}
.ph{flex:1 1 0; min-width:76px; border:1px solid var(--line); border-radius:4px;
  background:var(--surface); padding:6px 7px 7px; display:flex; flex-direction:column; gap:2px}
.ph .k{font-size:9.5px; font-weight:600; letter-spacing:.06em; color:var(--mute)}
.ph .q{font-size:11px; line-height:1.28; color:var(--steel)}
.ph.used{background:var(--ground); border-color:var(--line-2)}
.ph.used .q{color:var(--ink-2)}
.ph.done{background:var(--ok-bg); border-color:var(--ok-line)}
.ph.done .k{color:var(--ok)}
.ph.now{background:var(--accent-bg); border-color:var(--accent-bright); border-width:2px;
  padding:6px 8px 7px}
.ph.now .k{color:var(--accent)}
.ph.skip{opacity:.42}
.ph.skip .q{text-decoration:line-through; text-decoration-thickness:1px}

/* ---- object cards (trailer / visit) ------------------------------------ */
.objs{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(288px,1fr))}
.obj{border:1px solid var(--line); border-radius:6px; background:var(--ground);
  display:flex; flex-direction:column; min-width:0}
.obj.focus{border-color:var(--nav); box-shadow:inset 0 0 0 1px var(--nav)}
.obj>h3{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;
  padding:9px 12px 8px; border-bottom:1px solid var(--line); background:var(--surface-2)}
.obj>h3 .n{font-size:14.5px; font-weight:700}
.obj>h3 .c{font-size:11px; color:var(--steel); margin-right:auto}
.obj>h3 button{background:none; border:1px solid var(--line-2); border-radius:3px;
  font-size:10px; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
  padding:2px 6px; cursor:pointer; color:var(--steel)}
.obj>h3 button:hover{border-color:var(--nav); color:var(--nav)}
.display{padding:8px 12px; border-bottom:1px solid var(--line); background:var(--ground)}
.display .lbl{font-size:10px; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
  color:var(--mute)}
.display .val{font-size:16px; font-weight:600; letter-spacing:-.015em}
.dims{display:grid; gap:0; padding:0}
.dim{display:grid; grid-template-columns:104px minmax(0,1fr); gap:8px; align-items:baseline;
  padding:5px 12px; border-bottom:1px solid var(--surface-2)}
.dim:last-child{border-bottom:0}
.dim .d{font-size:10.5px; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
  color:var(--mute)}
.dim .v{font-size:12px; overflow-wrap:anywhere}
.dim.collapsed{display:none}
.dim .why{font-size:10.5px; color:var(--mute); display:block}

/* ---- badges ------------------------------------------------------------ */
.bdg{display:inline-flex; align-items:center; gap:4px; padding:1px 6px; border-radius:3px;
  font-size:11px; font-weight:600; border:1px solid var(--line-2); background:var(--surface);
  color:var(--ink-2); white-space:nowrap}
.bdg.g{color:var(--ok); border-color:var(--ok-line); background:var(--ok-bg)}
.bdg.a{color:var(--warn); border-color:var(--warn-line); background:var(--warn-bg)}
.bdg.r{color:var(--bad); border-color:var(--bad-line); background:var(--bad-bg)}
.bdg.b{color:var(--info); border-color:var(--info-line); background:var(--info-bg)}
.bdg.m{color:var(--mute)}
.flags{display:flex; flex-wrap:wrap; gap:4px; padding:9px 12px; border-top:1px solid var(--line);
  background:var(--surface)}
.flags:empty{display:none}
.flags .none{font-size:11.5px; color:var(--mute)}

/* ---- action console ---------------------------------------------------- */
.tier{display:flex; flex-direction:column; gap:6px}
.tier>.t{font-size:10px; font-weight:600; letter-spacing:.12em; text-transform:uppercase;
  color:var(--mute); display:flex; align-items:center; gap:7px}
.tier>.t i{flex:1; height:1px; background:var(--line); font-style:normal}
.acts{display:flex; flex-wrap:wrap; gap:7px}
.act{display:inline-flex; flex-direction:column; gap:1px; align-items:flex-start;
  border:1px solid var(--line-2); border-radius:4px; background:var(--ground);
  padding:6px 11px; cursor:pointer; text-align:left; max-width:100%}
.act .an{font-size:12px; font-weight:600}
.act .aw{font-size:10.5px; color:var(--steel); overflow-wrap:anywhere}
.act:hover{border-color:var(--nav)}
.act.p{background:var(--nav); border-color:var(--nav); color:var(--nav-ink)}
.act.p:hover{background:var(--nav-hover)}
.act.p .aw{color:var(--nav-ink); opacity:.78}
.act.d{cursor:not-allowed; background:var(--warn-bg); border-color:var(--warn-line);
  border-style:dashed; color:var(--warn)}
.act.d:hover{border-color:var(--warn-line)}
.act.h{cursor:default; background:var(--surface); border-style:dotted; color:var(--mute)}
.act.sup{border-color:var(--bad-line); color:var(--bad); background:var(--bad-bg)}
.act.next{box-shadow:0 0 0 2px var(--accent-bright)}
.supwrap{border:1px dashed var(--bad-line); border-radius:4px; padding:9px 11px;
  background:var(--bad-bg); display:flex; flex-direction:column; gap:6px}
.supwrap .note{font-size:11px; color:var(--bad)}
.hidnote{font-size:11.5px; color:var(--mute)}

/* ---- script ------------------------------------------------------------ */
.steps{display:flex; flex-direction:column}
.step{display:grid; grid-template-columns:52px minmax(0,1fr) auto; gap:10px;
  padding:8px 13px; border-bottom:1px solid var(--surface-2); align-items:baseline}
.step:last-child{border-bottom:0}
.step .sid{font-size:11px; font-weight:600; color:var(--mute)}
.step .sy{font-size:12.5px; line-height:1.4}
.step .sy .who{color:var(--steel); font-size:11px}
.step .sy .ref{font-size:10.5px; color:var(--mute)}
.step .mk{font-size:11px; font-weight:600; white-space:nowrap}
.step.now{background:var(--accent-bg); box-shadow:inset 3px 0 0 var(--accent-bright)}
.step.past{opacity:.62}
.step.pass .mk{color:var(--ok)}
.step.fail{background:var(--bad-bg)}
.step.fail .mk{color:var(--bad)}

/* ---- log + findings rail ---------------------------------------------- */
.logl{display:flex; flex-direction:column; padding:0}
.ev{display:grid; grid-template-columns:34px minmax(0,1fr); gap:8px; padding:6px 13px;
  border-bottom:1px solid var(--surface-2); font-size:11.5px; align-items:baseline}
.ev .tm{color:var(--mute); font-size:10.5px}
.ev .bo{overflow-wrap:anywhere}
.ev .bo b{font-weight:600}
.ev.sys .bo{color:var(--steel)}
.ev.dev{background:var(--warn-bg)}
.find{border-bottom:1px solid var(--line); padding:10px 13px; display:flex;
  flex-direction:column; gap:4px}
.find .fh{display:flex; align-items:baseline; gap:7px}
.find .fn{font-size:12.5px; font-weight:600; flex:1}
.find .fb{font-size:11.5px; color:var(--ink-2); line-height:1.45}
.find .fr{font-size:10.5px; color:var(--mute)}
.find .fa{display:flex; gap:6px; margin-top:2px}
.mini{background:none; border:1px solid var(--line-2); border-radius:3px; cursor:pointer;
  font-size:10.5px; font-weight:600; padding:2px 7px; color:var(--steel)}
.mini:hover{border-color:var(--nav); color:var(--nav)}
.mini.on{background:var(--nav); border-color:var(--nav); color:var(--nav-ink)}
textarea{width:100%; font-family:inherit; font-size:12.5px; padding:7px 9px;
  border:1px solid var(--line-2); border-radius:4px; background:var(--ground); color:var(--ink);
  resize:vertical; min-height:62px}

/* ---- prompt sheet ------------------------------------------------------ */
dialog{border:1px solid var(--line); border-radius:6px; background:var(--ground);
  color:var(--ink); padding:0; width:min(460px,calc(100vw - 28px)); box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(8,14,19,.55)}
dialog header{padding:11px 15px; border-bottom:1px solid var(--line); background:var(--surface)}
dialog header h3{font-size:13.5px; font-weight:700}
dialog header p{font-size:11.5px; color:var(--steel); margin-top:2px}
dialog .fbd{padding:14px 15px; display:flex; flex-direction:column; gap:12px}
dialog footer{padding:11px 15px; border-top:1px solid var(--line); display:flex;
  justify-content:flex-end; gap:8px; background:var(--surface)}
.fld{display:flex; flex-direction:column; gap:4px}
.fld>span{font-size:11px; font-weight:600; letter-spacing:.04em; color:var(--steel)}
.recon{display:flex; flex-direction:column; border:1px solid var(--line); border-radius:4px}
.recon .rr{padding:8px 11px; border-bottom:1px solid var(--surface-2); display:flex;
  flex-direction:column; gap:5px}
.recon .rr:last-child{border-bottom:0}
.recon .rn{font-size:12.5px; font-weight:600}
.recon .ro{display:flex; flex-wrap:wrap; gap:5px}
.ochip{display:inline-flex; align-items:center; gap:5px; border:1px solid var(--line-2);
  border-radius:3px; padding:3px 8px; font-size:11.5px; cursor:pointer}
.ochip input{margin:0; accent-color:var(--nav)}
.ochip.sel{border-color:var(--nav); background:var(--surface-2)}
.ochip.locked{opacity:.45; cursor:not-allowed}
.btn{border:1px solid var(--nav); background:var(--ground); color:var(--nav); border-radius:4px;
  padding:7px 14px; font-size:13px; font-weight:600; cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.p{background:var(--nav); color:var(--nav-ink)}
.btn.p:hover{background:var(--nav-hover)}
.btn:disabled{opacity:.45; cursor:not-allowed}

/* ---- config sheet ----------------------------------------------------- */
.cfg{display:flex; flex-direction:column; gap:9px}
.cfgrow{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; align-items:center;
  padding-bottom:8px; border-bottom:1px solid var(--surface-2)}
.cfgrow:last-child{border-bottom:0}
.cfgrow .ck{font-size:12px; font-weight:600}
.cfgrow .cd{font-size:11px; color:var(--steel)}
.sw{position:relative; width:36px; height:20px; flex:none}
.sw input{position:absolute; inset:0; opacity:0; margin:0; cursor:pointer; width:100%; height:100%}
.sw i{position:absolute; inset:0; border-radius:10px; background:var(--surface-3);
  border:1px solid var(--line-2); transition:background .12s ease}
.sw i::after{content:""; position:absolute; top:2px; left:2px; width:14px; height:14px;
  border-radius:50%; background:var(--ground); transition:transform .12s ease}
.sw input:checked+i{background:var(--nav); border-color:var(--nav)}
.sw input:checked+i::after{transform:translateX(16px)}
.sw input:focus-visible+i{outline:2px solid var(--accent-bright); outline-offset:2px}

/* ---- notes / callouts -------------------------------------------------- */
.note{border:1px solid var(--line); border-left:3px solid var(--accent-bright);
  background:var(--surface); border-radius:4px; padding:9px 12px; font-size:12px;
  line-height:1.5; color:var(--ink-2)}
.note b{color:var(--ink)}
.note.bad{border-left-color:var(--bad-line); background:var(--bad-bg)}
.note.ok{border-left-color:var(--ok-line); background:var(--ok-bg)}
.legend{display:flex; flex-wrap:wrap; gap:12px; font-size:11px; color:var(--steel)}
.legend span{display:flex; align-items:center; gap:5px}
.sw-k{width:20px; height:11px; border-radius:2px; border:1px solid var(--line-2);
  display:inline-block}
.tabs{display:flex; gap:2px}
.tab{background:none; border:1px solid transparent; border-bottom:2px solid transparent;
  padding:4px 9px; font-size:11.5px; font-weight:600; color:var(--steel); cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--nav)}
.wide{overflow-x:auto}
</style>

<header class="top">
  <span class="brand">
    <b>Yard Flow Bench</b>
    <span>Walks the yard &amp; dock document set against itself — model v0.20 · flows v0.4 · matrix v0.10 · glossary v0.4</span>
  </span>
  <span class="topctl">
    <label for="role">Acting as</label>
    <select id="role"></select>
  </span>
  <span class="topctl">
    <button class="mini" id="cfgbtn" type="button">Facility config</button>
    <button class="mini" id="hidbtn" type="button">Show hidden actions</button>
    <button class="mini" id="resetbtn" type="button">Reset scenario</button>
  </span>
</header>

<div class="shell">

  <nav class="rail" id="rail" aria-label="Scenarios"></nav>

  <main class="stage">
    <section class="panel flat">
      <header>
        <h2>The spine — every flow is a subset of these six phases</h2>
        <span class="id" id="flowid" style="font-size:11px;color:var(--steel)"></span>
      </header>
      <div class="bd" style="gap:9px">
        <div class="spine" id="spine"></div>
        <p class="hidnote" id="spinenote"></p>
      </div>
    </section>

    <section class="panel flat">
      <header><h2 id="scenname">Scenario</h2><span class="id" id="scenref" style="font-size:11px;color:var(--steel)"></span></header>
      <div class="bd" style="gap:10px">
        <p id="scendek" style="font-size:13px;color:var(--ink-2);max-width:70ch"></p>
        <div id="scenwarn"></div>
      </div>
    </section>

    <div class="objs" id="objs"></div>

    <section class="panel flat">
      <header>
        <h2>What can be done right now</h2>
        <span class="legend">
          <span><i class="sw-k" style="background:var(--nav);border-color:var(--nav)"></i>available</span>
          <span><i class="sw-k" style="background:var(--warn-bg);border-color:var(--warn-line)"></i>blocked, reason shown</span>
          <span><i class="sw-k" style="background:var(--surface);border-style:dotted"></i>hidden</span>
        </span>
      </header>

<script>
"use strict";
/* ===========================================================================
   PART 1 — VOCABULARY
   Lifted verbatim from glossary.md §5 and §7 so the engine and the document
   share one spelling. Anything the engine invents is marked ENGINE.
   ======================================================================== */

const LABEL = {           /* internal identifier -> displayed label (glossary §1.1) */
  AWAITING_ASSIGNMENT_DEST:"Awaiting Dock",
  DOCK_ASSIGNED:"Dock Assigned", YARD_ASSIGNED:"Going to yard", NONE:"No destination",
  NOT_READY:"Not ready", IN_PREP:"In prep", READY:"Ready",
  AWAITING_DOCK:"Awaiting Dock", SPOTTED:"Spotted", NEEDS_MOVE:"Needs move",
  DROPPED_NO_DESTINATION:"Dropped — no dock", READY_TO_PULL:"Ready to pull",
  BLOCKING_DOCK:"Blocking dock", ACCEPTING_FREIGHT:"Open — accepting",
  READY_TO_DEPART:"Ready to depart", PRELOAD_STAGED:"Staged", STAGED_AGING:"Staged — aging",
  AVAILABLE_FOR_ASSIGNMENT:"Available", AWAITING_ASSIGNMENT:"Awaiting assignment",
  PART_LOAD_HELD:"Part load — blocked", PARTIAL_RECEIPT:"Partial receipt",
  UNEXPECTED_RESIDUAL:"Unexpected freight", DETENTION_RISK:"Detention risk",
  PAST_WINDOW:"Past window", OUTSIDE_PERIMETER:"Outside gate",
  FREIGHT_OUTSIDE_PERIMETER:"Freight outside gate", FIRST_VISIT:"First visit",
  ID_DISPUTED:"ID disputed", ID_SINGLE_SOURCE:"ID unconfirmed",
  ENTERED_WITHOUT_CHECKIN:"Unauthorized entry", UNDECLARED_TRAILER_EXIT:"Wrong trailer left",
  DECLARED_SUBSTITUTION:"Substituted", SUBSTITUTE_CARRIES_FREIGHT:"Substitute loaded",
  PICKUP_NOT_TAKEN:"Pickup not taken",
  DEPARTED_WITHOUT_AUTHORIZATION:"Left unauthorized", RECOVERY_WINDOW_OPEN:"Recoverable",
  SPOT_CONFLICT:"Spot conflict", POSITION_STALE:"Position unconfirmed",
  PLACEMENT_VARIANCE:"Placed elsewhere", UNVERIFIED_ASSIGNMENT:"Empty unverified",
  INTEGRITY_ALARM:"Needs review", TRACTOR_ATTACHED:"Tractor attached",
  UNRECORDED_DOCK_OCCUPANCY:"Unknown at dock", SPOT_UNCONFIRMED:"Not at dock?",
  UNRECORDED_DOCK_DEPARTURE:"Left dock unrecorded", AWAITING_INTAKE:"Awaiting intake",
  AT_DESTINATION:"At destination"
};
/* tone per flag: r = exception, a = attention, g = good, b = informational */
const FLAG_TONE = {
  INTEGRITY_ALARM:"r", UNEXPECTED_RESIDUAL:"r", PART_LOAD_HELD:"r",
  ENTERED_WITHOUT_CHECKIN:"r", UNDECLARED_TRAILER_EXIT:"r", SPOT_CONFLICT:"r",
  DEPARTED_WITHOUT_AUTHORIZATION:"r", FREIGHT_OUTSIDE_PERIMETER:"r", ID_DISPUTED:"r",
  UNRECORDED_DOCK_OCCUPANCY:"r", SPOT_UNCONFIRMED:"r", UNRECORDED_DOCK_DEPARTURE:"r",
  DETENTION_RISK:"a", STAGED_AGING:"a", PAST_WINDOW:"a", DROPPED_NO_DESTINATION:"a",
  AWAITING_ASSIGNMENT:"a", UNVERIFIED_ASSIGNMENT:"a", PICKUP_NOT_TAKEN:"a",
  BLOCKING_DOCK:"a", NOT_READY:"a", AWAITING_INTAKE:"a", ID_SINGLE_SOURCE:"a",
  READY_TO_DEPART:"g", READY_TO_PULL:"g", AVAILABLE_FOR_ASSIGNMENT:"g", SPOTTED:"g",
  PARTIAL_RECEIPT:"b", DECLARED_SUBSTITUTION:"b", PRELOAD_STAGED:"b",
  ACCEPTING_FREIGHT:"b", TRACTOR_ATTACHED:"m", AT_DESTINATION:"m", FIRST_VISIT:"b",
  AWAITING_DOCK:"a", NEEDS_MOVE:"a", PLACEMENT_VARIANCE:"b", POSITION_STALE:"a",
  OUTSIDE_PERIMETER:"b", SUBSTITUTE_CARRIES_FREIGHT:"r", RECOVERY_WINDOW_OPEN:"a"
};

/* Blocked-action copy, matrix §3. These are UI strings, not paraphrase. */
const WHY = {
  OOS:"Trailer is out of service",
  INTEGRITY:"Trailer state needs review before any action",
  BOTH_DIRS:"Trailer holds both inbound and outbound freight — resolve first",
  SESSION_ACTIVE:"Work is in progress at the dock",
  SESSION_OPEN:"End or cancel the open session first",
  MOVE_OPEN:"A move is already open for this trailer",
  NOT_ADMITTED:"Admit the visit first",
  NO_SHIPMENT_IN_SESSION:"Add at least one shipment",
  FILL_OPEN:"Declare fill complete first",
  FILL_COMPLETE:"Fill is declared complete — reopen fill to add freight",
  PART_LOADED:"Resolve the part-loaded shipment first",
  NOT_SEALED:"Seal the trailer first",
  SEALED:"Break the seal first",
  RESIDUAL:"Unexpected freight aboard — verify against the manifest",
  UNVERIFIED:"Confirm the trailer is empty",
  ROLE:"Not permitted for your role",
  NO_DEST:"Assign a dock or yard destination first",
  IDENTIFY:"Identify the arriving trailer first",
  DOCKPASS:"Dockpass expired or already used",
  RENUMBER:"Cannot renumber during active work",
  NOT_AUTHORIZED:"Visit is not authorized to depart",
  NO_ACTUAL:"Report where the trailer was actually placed"
};

/* Condition precedence, matrix §1.3. Lower acts first. */
const CLS = {SERVICE:1, PHYSICAL:2, DATA:3, PERMISSION:4, STRUCTURAL:2};

const ROLES = [
  {id:"GUARD", label:"Guard"},
  {id:"CLERK", label:"Gate clerk"},
  {id:"DISPATCHER", label:"Dispatcher"},
  {id:"DOCK_LEAD", label:"Dock lead"},
  {id:"SPOTTER", label:"Spotter (yard team)"},
  {id:"DRIVER", label:"Driver"},
  {id:"SUPERVISOR", label:"Supervisor"}
];

const PHASES = [
  {k:"P0", n:"Plan",             q:"What is expected?"},
  {k:"P1", n:"Announce & access",q:"Who is here, and may they enter?"},
  {k:"P2", n:"Destination",      q:"Where is this trailer going?"},
  {k:"P3", n:"Position",         q:"Get it there"},
  {k:"P4", n:"Dock work",        q:"Load or unload"},
  {k:"P5", n:"Depart",           q:"Authorize and record leaving"},
  {k:"P6", n:"After",            q:"Reconcile what actually happened"}
];

/* Facility config, glossary §9. Only the keys the engine actually reads. */
const CONFIG_KEYS = [
  {k:"readiness_requirements", kind:"list", def:[],
   d:"A list, not a flag. Empty collapses the readiness dimension entirely — no state, screen or prompt may mention it.",
   opts:[["", "none (plain cross-dock)"],["wash,inspect","wash, inspect"],["pre-cool","pre-cool (reefer)"]]},
  {k:"require_readiness_before_assignment", kind:"flag", def:false,
   d:"A genuine flag: it changes a precondition on ASSIGN_SHIPMENT."},
  {k:"dock_presence_sensors", kind:"flag", def:true,
   d:"Where installed. Decides whether spot-in is auto-confirmed and whether SPOTTED can ever fire."},
  {k:"auto_create_move_on_dock_assignment", kind:"flag", def:false,
   d:"Facility choice. Assigning a dock creates the move task with no human."},
  {k:"admit_live_load_without_dock", kind:"flag", def:true,
   d:"Facility choice. Off means HOLD_OUTSIDE is the only path when no dock is free."},
  {k:"has_inside_lot", kind:"flag", def:true,
   d:"Lot inventory, not a capacity computation. A facility with an inside lot effectively never uses HOLD_OUTSIDE."},
  {k:"identification_cameras", kind:"flag", def:true,
   d:"Entry and exit reads. Detective, never preventive — no gate decision waits on one."},
  {k:"exit_identification_enabled", kind:"flag", def:true,
   d:"Where cameras exist. Departure time backfills from the image capture timestamp."},
  {k:"allow_add_shipment_to_active_session", kind:"flag", def:true,
   d:"On by default. Lets a shipment join a session already ACTIVE, timed from joined_at."},
  {k:"roles_can_declare_fill_complete", kind:"roles", def:["DOCK_LEAD","SUPERVISOR"],
   d:"Facility-defined. The matrix never names which role is missing — a wrong hint is worse than none."}
];
/* ===========================================================================
   PART 2 — THE WORLD, AND WHAT IS DERIVED FROM IT

   Six trailer dimensions and three visit dimensions are stored (glossary §5).
   Load state and every flag are computed on read, never stored — model §3.1
   and §6.1 both insist on this, and it is the reason a contradiction here
   surfaces as an INTEGRITY_ALARM rather than as two fields disagreeing.
   ======================================================================== */

let W = null;           /* the world */
let SCEN = null;        /* active scenario */
let CURSOR = 0;         /* script position */
let DEVIATIONS = [];
let SHOW_HIDDEN = false;
let FINDINGS = [];      /* seeded + viewer-added */
let db = null;

function blankWorld(cfg){
  return {
    clock: 8*60,                     /* minutes since midnight; shift starts 08:00 */
    config: cfg || defaultConfig(),
    role: "CLERK",
    docks: {}, spots: {}, lots: {},
    trailers: {}, shipments: {}, loads: [],
    visits: {}, sessions: [], moves: [], assignments: [],
    idents: [], events: [], returns: [],
    focusTrailer: null, focusVisit: null,
    seq: 1
  };
}
function defaultConfig(){
  const c = {};
  CONFIG_KEYS.forEach(k => { c[k.k] = Array.isArray(k.def) ? k.def.slice() : k.def; });
  return c;
}

/* ---- constructors ------------------------------------------------------ */
function mkTrailer(w, o){
  const t = Object.assign({
    id:o.id, number:o.number, carrier:o.carrier||"SWIFT", kind:o.kind||"53' DRY",
    position:"OFF_SITE", dock:null, spot:null, lot:null,
    destination:"NONE", requested_destination:null,
    readiness: (w.config.readiness_requirements||[]).length ? "NOT_READY" : "READY",
    service:"IN_SERVICE",
    fill:"OPEN", empty_verification:"UNVERIFIED",
    tractor:false, sealed:false,
    identity_confidence:"SINGLE_SOURCE", position_confidence:"REPORTED",
    first_visit:true, intake:null, stay:null, staged_since:null,
    last_variance:false, verified_by_check:true
  }, o);
  w.trailers[t.id] = t; return t;
}
function mkShipment(w, o){
  const s = Object.assign({id:o.id, direction:o.direction,
    status: o.direction==="OUTBOUND" ? "PLANNED" : "EXPECTED", consignee:o.consignee||"—"}, o);
  w.shipments[s.id] = s; return s;
}
function mkLoad(w, shipment_id, trailer_id, link_state){
  const sh = W===w ? w.shipments[shipment_id] : w.shipments[shipment_id];
  const row = {shipment_id, trailer_id, link_state, direction: sh.direction};
  w.loads.push(row); return row;
}
function mkVisit(w, o){
  const v = Object.assign({
    id:o.id, registration:"NOT_REGISTERED", presence:"OFF_SITE",
    visit_type:"LIVE", party_type:"THIRD_PARTY", access_method:"DOCKPASS",
    legs:[], dockpass:null, dockpass_consumed:false,
    arrived_at:null, admitted_at:null, on_site_since:null,
    window:[9*60, 11*60], turned_away:false, departed_at:null,
    held_outside:false, substituted:false
  }, o);
  w.visits[v.id] = v; return v;
}
function mkDock(w, id){ w.docks[id] = {id, state:"FREE", sensor:"VACANT", holder:null}; }
function mkSpot(w, id){ w.spots[id] = {id, occupants:[]}; }
function mkLot(w, id, inside){ w.lots[id] = {id, inside_fence:inside}; }

/* ---- accessors --------------------------------------------------------- */
const rowsOf   = (w,tid) => w.loads.filter(r => r.trailer_id===tid);
const legsOf   = (w,vid) => (w.visits[vid] ? w.visits[vid].legs : []);
const bringLeg = (w,v)   => v && v.legs.find(l => l.kind==="BRING") || null;
const takeLeg  = (w,v)   => v && v.legs.find(l => l.kind==="TAKE")  || null;
const openSession = (w,tid) => w.sessions.find(s =>
  s.trailer_id===tid && (s.state==="OPEN" || s.state==="ACTIVE")) || null;
const lastSession = (w,tid) => w.sessions.filter(s => s.trailer_id===tid).slice(-1)[0] || null;
const openMove  = (w,tid) => w.moves.find(m =>
  m.trailer_id===tid && !["COMPLETED","CANCELLED"].includes(m.state)) || null;
const heldAssign = (w,tid) => w.assignments.find(a =>
  a.trailer_id===tid && a.state==="HELD") || null;
function visitOfTrailer(w, tid){
  return Object.values(w.visits).find(v => !v.departed_at && !v.turned_away &&
    v.legs.some(l => l.trailer_id===tid)) || null;
}
const onSite = t => !["OFF_SITE"].includes(t.position) &&
  !(t.position==="LOT" && t.lot && W.lots[t.lot] && !W.lots[t.lot].inside_fence);

/* ---- load state, model §3.1 (precedence order; first match wins) ------- */
function loadState(w, tid){
  const rows = rowsOf(w,tid);
  const has = st => rows.some(r => r.link_state===st);
  const inWork = has("LOADING") || has("UNLOADING");
  const active = w.sessions.some(s => s.trailer_id===tid && s.state==="ACTIVE");
  const dirs = new Set(rows.map(r => r.direction));
  if ((inWork && !active) || (dirs.has("INBOUND") && dirs.has("OUTBOUND"))) return "INTEGRITY_ALARM";
  if (inWork) return "IN_WORK";
  if (has("PART_LOADED")) return "PART_LOADED";
  if (has("ON_BOARD")) return "HAS_FREIGHT";
  if (has("ASSIGNED")) return "ASSIGNED_ONLY";
  return "EMPTY";
}
const hasFreight = (w,tid) => ["HAS_FREIGHT","PART_LOADED","IN_WORK"].includes(loadState(w,tid));

/* readiness is invisible where no requirements are configured (model §3.7) */
const readinessLive = w => (w.config.readiness_requirements||[]).length > 0;
const sensorsLive   = w => !!w.config.dock_presence_sensors;
const camerasLive   = w => !!w.config.identification_cameras;

/* ---- destination / position agreement --------------------------------- */
function atDestination(w,t){
  if (t.destination==="DOCK_ASSIGNED") return t.position==="DOCK" && !!t.dock;
  if (t.destination==="YARD_ASSIGNED") return t.position==="YARD_SPOT" || t.position==="LOT";
  return false;
}

/* ---- derived flags, model §6.1 / glossary §7 -------------------------- */
function flagsOf(w, tid){
  const t = w.trailers[tid]; if(!t) return [];
  const f = [];
  const rows = rowsOf(w,tid), ls = loadState(w,tid);
  const v = visitOfTrailer(w,t.id);
  const sess = openSession(w,tid), mv = openMove(w,tid);
  const inOutsideLot = t.position==="LOT" && t.lot && !w.lots[t.lot].inside_fence;

  if (ls==="INTEGRITY_ALARM") f.push("INTEGRITY_ALARM");
  if (t.tractor) f.push("TRACTOR_ATTACHED");
  if (t.destination==="AWAITING_ASSIGNMENT") f.push("AWAITING_DOCK");
  if (atDestination(w,t)) f.push("AT_DESTINATION");
  /* SPOTTED is the narrow sense only: at a dock AND sensor-confirmed (glossary §2) */
  if (t.position==="DOCK" && t.dock && sensorsLive(w) && w.docks[t.dock].sensor==="OCCUPIED")
    f.push("SPOTTED");
  if (sensorsLive(w)){
    Object.values(w.docks).forEach(d => {
      const believed = Object.values(w.trailers).find(x => x.position==="DOCK" && x.dock===d.id);
      if (d.sensor==="OCCUPIED" && !believed && d.id===t.dock) f.push("UNRECORDED_DOCK_OCCUPANCY");
    });
    if (t.position==="DOCK" && t.dock && w.docks[t.dock].sensor==="VACANT"){
      f.push("SPOT_UNCONFIRMED");
      if (t.stay || sess) f.push("UNRECORDED_DOCK_DEPARTURE");
    }
  }
  if (!t.tractor && (t.position==="YARD_SPOT"||t.position==="LOT") &&
      t.destination==="AWAITING_ASSIGNMENT") f.push("DROPPED_NO_DESTINATION");
  if (!mv && t.destination!=="NONE" && !atDestination(w,t) && onSite(t) && !t.tractor)
    f.push("NEEDS_MOVE");
  if (inOutsideLot) f.push("OUTSIDE_PERIMETER");
  if (inOutsideLot && hasFreight(w,tid)) f.push("FREIGHT_OUTSIDE_PERIMETER");
  if (t.intake==="AWAITING_INTAKE") f.push("AWAITING_INTAKE");
  if (readinessLive(w) && t.readiness==="NOT_READY") f.push("NOT_READY");
  if (t.position==="DOCK" && !sess && (t.fill==="COMPLETE" || ls==="EMPTY")) f.push("READY_TO_PULL");
  if (t.position==="DOCK" && ls==="EMPTY" && !rows.length && !sess) f.push("AWAITING_ASSIGNMENT");
  if (hasFreight(w,tid) && t.fill==="OPEN") f.push("ACCEPTING_FREIGHT");
  if (t.readiness==="READY" && ls==="EMPTY" && t.service==="IN_SERVICE" && onSite(t) &&
      !rows.length && t.intake!=="AWAITING_INTAKE") f.push("AVAILABLE_FOR_ASSIGNMENT");
  if (rows.some(r => r.link_state==="PART_LOADED")) f.push("PART_LOAD_HELD");
  if (rows.some(r => r.link_state==="ASSIGNED") && t.empty_verification==="CLAIMED_EMPTY")
    f.push("UNVERIFIED_ASSIGNMENT");
  if (t.sealed && rows.some(r => r.direction==="OUTBOUND" && r.link_state==="ON_BOARD") &&
      (t.position==="YARD_SPOT"||t.position==="LOT")) f.push("PRELOAD_STAGED");
  if (t.staged_since!=null && w.clock - t.staged_since > 240) f.push("STAGED_AGING");
  if (t.last_variance) f.push("PLACEMENT_VARIANCE");
  if (t.first_visit) f.push("FIRST_VISIT");
  if (t.identity_confidence==="DISPUTED") f.push("ID_DISPUTED");
  else if (t.identity_confidence==="SINGLE_SOURCE" && camerasLive(w) && onSite(t))
    f.push("ID_SINGLE_SOURCE");
  if (!t.verified_by_check) f.push("POSITION_STALE");
  Object.values(w.spots).forEach(s => { if (s.occupants.length>1 && s.occupants.includes(tid))
    f.push("SPOT_CONFLICT"); });

  /* visit-sourced flags, shown on the trailer because that is where they bite */
  if (v){
    const tl = takeLeg(w,v);
    if (tl && tl.trailer_id===tid){
      const expected = (tl.expected_shipment_ids||[]).slice();
      const residual = (tl.expected_residual_shipment_ids||[]).slice();
      const aboard = rows.filter(r => r.link_state==="ON_BOARD").map(r => r.shipment_id);
      const stray = aboard.filter(s => !expected.includes(s) && !residual.includes(s));
      if (stray.length) f.push("UNEXPECTED_RESIDUAL");
      const resAboard = aboard.filter(s => residual.includes(s));
      if (resAboard.length && !stray.length) f.push("PARTIAL_RECEIPT");
      if (readyToDepart(w,v,tid) && !stray.length) f.push("READY_TO_DEPART");
    }
    if (v.visit_type==="LIVE" && v.on_site_since!=null &&
        w.clock - v.on_site_since >= 90) f.push("DETENTION_RISK");
    if (w.clock > v.window[1] && !v.departed_at) f.push("PAST_WINDOW");
    if (v.substituted) f.push("DECLARED_SUBSTITUTION");
  }
  /* exit-read outcomes, resolved after departure (model §5.1) */
  w.idents.filter(i => i.kind==="EXIT" && i.unresolved).forEach(i => {
    if (i.declared_trailer===tid || i.read_trailer===tid){
      if (i.outcome==="UNDECLARED") f.push("UNDECLARED_TRAILER_EXIT");
      if (i.outcome==="UNAUTHORIZED") f.push("DEPARTED_WITHOUT_AUTHORIZATION");
      if (i.outcome==="UNDECLARED" && w.clock - i.at <= 30) f.push("RECOVERY_WINDOW_OPEN");
    }
  });
  if (w.idents.some(i => i.kind==="ENTRY" && i.no_registration && i.read_trailer===tid))
    f.push("ENTERED_WITHOUT_CHECKIN");
  if (v && v.pickup_not_taken) f.push("PICKUP_NOT_TAKEN");

  return [...new Set(f)];
}

/* READY_TO_DEPART / AUTHORIZE_DEPARTURE share one predicate so the flag and
   the action can never disagree (glossary §7, model §5.1). */
function readyToDepart(w, v, tid){
  const t = w.trailers[tid]; if(!t) return false;
  const tl = takeLeg(w,v); if(!tl || tl.trailer_id!==tid) return false;
  const rows = rowsOf(w,tid);
  const outboundAboard = rows.some(r => r.direction==="OUTBOUND" && r.link_state==="ON_BOARD");
  if (outboundAboard){
    if (t.fill!=="COMPLETE") return false;
    if (!t.sealed && v.party_type!=="COMPANY_DRIVER") return false;
  }
  if (rows.some(r => r.link_state==="PART_LOADED")) return false;
  return true;
}

/* composed display string, model §3.6.5 */
function displayStatus(w, tid){
  const t = w.trailers[tid]; if(!t) return "—";
  const v = visitOfTrailer(w,t.id);
  const pending = v && (v.presence==="AT_FACILITY" || v.presence==="AT_GATE");
  const tail = pending ? " — Pending Gate Check-In" : "";
  if (t.position==="DOCK" && t.dock){
    const spotted = sensorsLive(w) && w.docks[t.dock].sensor==="OCCUPIED";
    return (spotted ? "Spotted at Dock " : "At Dock ") + t.dock;
  }
  if (t.destination==="AWAITING_ASSIGNMENT") return "Awaiting Dock" + tail;
  if (t.destination==="DOCK_ASSIGNED") return "Dock Assigned" + tail;
  if (t.destination==="YARD_ASSIGNED") return "Going to yard" + tail;
  if (t.position==="OFF_SITE") return v && v.departed_at ? "Departed" : "Off site";
  if (t.position==="IN_MOTION"){
    const m = openMove(w,tid);
    return "In motion → " + (m ? m.requested_destination : "—");
  }
  if (t.position==="YARD_SPOT") return "In yard" + (t.spot ? " · " + t.spot : "");
  if (t.position==="LOT") return (w.lots[t.lot] && w.lots[t.lot].inside_fence ? "Inside lot" : "Outside lot");
  if (t.position==="AT_GATE_IN") return "Inbound apron";
  if (t.position==="AT_GATE_OUT") return "Exit lane";
  return t.position;
}

/* ---- event log --------------------------------------------------------- */
function log(kind, body){
  W.events.push({at:W.clock, kind, body});
}
const hhmm = m => String(Math.floor(m/60)%24).padStart(2,"0") + ":" + String(m%60).padStart(2,"0");
/* ===========================================================================
   PART 3 — THE ACTION CATALOG

   One gate function per action, returning the list of conditions that FAIL.
   Treatment is then decided once, centrally, by matrix §1.1–1.5 — which is
   what matrix §6 open question 1 asks for ("make the treatment a property of
   the condition in code, so it is defined once rather than per screen").

   Each failure carries its precedence class (matrix §1.3) and its treatment:
     D — the clearing action is available here, to someone present
     H — clearing it needs a different plan, position, or operation
   ======================================================================== */

const D = (cls,why) => ({cls, t:"D", why});
const H = (cls,why) => ({cls, t:"H", why});

/* Treatment resolution. Two rules the documents state, and one they do not. */
function treat(fails){
  if (!fails.length) return {t:"A"};
  /* ENGINE DECISION (finding F9): nothing in matrix §1.1–1.3 says what wins
     when an action fails both a hidden-class and a disabled-class condition.
     Hiding wins here — showing "Trailer is out of service" on a control that
     is also structurally impossible sends the user to fix the wrong thing. */
  const hid = fails.filter(f => f.t==="H").sort((a,b)=>a.cls-b.cls);
  if (hid.length) return {t:"H", why:hid[0].why};
  const srt = fails.slice().sort((a,b)=>a.cls-b.cls);
  return {t:"D", why:srt[0].why};
}

/* Matrix §2.1, transcribed. The engine derives its own answer from the
   model's preconditions; where the two disagree the action is marked. */
const MATRIX_21 = {
  SELF_REGISTER:      {OFF_SITE:"H", AT_FACILITY:"H", AT_GATE:"H", ON_SITE:"H"},
  RECORD_ARRIVAL:     {OFF_SITE:"A", AT_FACILITY:"A", AT_GATE:"H", ON_SITE:"H"},
  ADMIT:              {OFF_SITE:"H", AT_FACILITY:"H", AT_GATE:"A", ON_SITE:"H"},
  REGISTER_AND_ADMIT: {OFF_SITE:"H", AT_FACILITY:"H", AT_GATE:"A", ON_SITE:"H"},
  ASSIGN_DOCK:        {OFF_SITE:"H", AT_FACILITY:"A", AT_GATE:"A", ON_SITE:"A"},
  RELEASE_DOCK:       {OFF_SITE:"H", AT_FACILITY:"A", AT_GATE:"A", ON_SITE:"A"},
  ASSIGN_YARD:        {OFF_SITE:"H", AT_FACILITY:"A", AT_GATE:"A", ON_SITE:"A"},
  BIND_TRAILER_TO_LEG:{OFF_SITE:"A", AT_FACILITY:"A", AT_GATE:"A", ON_SITE:"A"},
  TURN_AWAY:          {OFF_SITE:"H", AT_FACILITY:"A", AT_GATE:"A", ON_SITE:"A"},
  RESOLVE_IDENTIFICATION:{OFF_SITE:"H", AT_FACILITY:"H", AT_GATE:"A", ON_SITE:"A"},
  CREATE_MOVE_TASK:   {OFF_SITE:"H", AT_FACILITY:"D", AT_GATE:"D", ON_SITE:"A"},
  ASSIGN_SHIPMENT:    {OFF_SITE:"H", AT_FACILITY:"H", AT_GATE:"H"}
};
/* The §2.1 columns only govern gate processing. Once the trailer is past the
   apron, §2.2–2.6 take over and the comparison would be meaningless. */
function inGateContext(w, ctx){
  if (!ctx.t) return true;
  return ["OFF_SITE","AT_GATE_IN"].includes(ctx.t.position);
}
function matrixSays(id, w, ctx){
  if (!MATRIX_21[id] || !ctx.v || !inGateContext(w,ctx)) return null;
  return MATRIX_21[id][ctx.v.presence] || null;
}

/* ---- shared condition sets -------------------------------------------- */
function svc(w,t){
  const o = [];
  if (!t) return o;
  if (t.service==="OUT_OF_SERVICE") o.push(D(CLS.SERVICE, WHY.OOS));
  if (loadState(w,t.id)==="INTEGRITY_ALARM") o.push(D(CLS.SERVICE, WHY.INTEGRITY));
  return o;
}
function roleIn(w, list){ return list.includes(w.role); }
function needRole(w, list){
  return roleIn(w,list) ? [] : [D(CLS.PERMISSION, WHY.ROLE)];
}
const SUP = ["SUPERVISOR"];

/* ======================================================================== */
const ACTIONS = {

/* ---------------- 5.1 Gate --------------------------------------------- */
SELF_REGISTER:{
  label:"Self-register", on:"visit", actor:"Driver", ref:"model §5.1 · flows P1a",
  gate(w,c){
    if (!c.v) return [H(CLS.STRUCTURAL,"No visit in context")];
    if (c.v.registration!=="NOT_REGISTERED") return [H(CLS.STRUCTURAL,"Already registered")];
    if (c.v.presence!=="OFF_SITE" && c.v.presence!=="AT_FACILITY")
      return [H(CLS.PHYSICAL,"Past the gate already")];
    if (w.clock < c.v.window[0]-120) return [D(CLS.DATA,"Outside the appointment window")];
    return [];
  },
  form(w,c){
    const bl = bringLeg(w,c.v);
    return bl && !bl.trailer_id
      ? [{k:"number", label:"Trailer number the driver gives", type:"text", def:bl.hint_number||""}]
      : [];
  },
  apply(w,c,vals){
    const v = c.v;
    v.registration = "SELF_REGISTERED";
    v.presence = "AT_FACILITY";
    v.arrived_at = w.clock;
    v.dockpass = String(10000 + Math.floor(Math.random()*89999));
    log("act","<b>SELF_REGISTER</b> — QR sign scanned at the facility. Dockpass "+v.dockpass+" issued.");
    const bl = bringLeg(w,v);
    if (bl && !bl.trailer_id && vals.number) bindLeg(w, v, bl, vals.number, "DRIVER");
    const t = bl && bl.trailer_id ? w.trailers[bl.trailer_id] : null;
    if (t) t.destination = "AWAITING_ASSIGNMENT";
    else log("sys","No BRING leg — nothing to set <b>destination</b> on. See finding F6.");
  }
},

RECORD_ARRIVAL:{
  label:"Record arrival", on:"visit", actor:"Guard", ref:"model §5.1",
  gate(w,c){
    if (!c.v) return [H(CLS.STRUCTURAL,"No visit in context")];
    if (c.v.registration==="SELF_REGISTERED")
      return [H(CLS.STRUCTURAL,"The QR scan already recorded arrival")];
    if (["AT_GATE","ON_SITE","AUTHORIZED_TO_DEPART","DEPARTED"].includes(c.v.presence))
      return [H(CLS.STRUCTURAL,"Arrival already recorded")];
    return [];
  },
  apply(w,c){
    c.v.presence = "AT_GATE"; c.v.arrived_at = w.clock;
    log("act","<b>RECORD_ARRIVAL</b> — truck noted in the gate lane.");
  }
},

ADMIT:{
  label:"Admit", on:"visit", actor:"Gate / kiosk", ref:"model §5.1 · flows P1b",
  gate(w,c){
    const v = c.v;
    if (!v) return [H(CLS.STRUCTURAL,"No visit in context")];
    if (["ON_SITE","AUTHORIZED_TO_DEPART","DEPARTED"].includes(v.presence))
      return [H(CLS.STRUCTURAL,"Already admitted")];
    const f = [];
    /* model §5.1: presence = AT_FACILITY or AT_GATE */
    if (!["AT_FACILITY","AT_GATE"].includes(v.presence))
      f.push(H(CLS.PHYSICAL,"The truck is not here yet"));
    const pass = v.dockpass && !v.dockpass_consumed;
    const gateReg = v.registration==="REGISTERED_AT_GATE";
    /* ENGINE (finding F7): flows §8 admits a company driver on an RF badge with
       no dockpass and no guard, but the catalog names no such credential. The
       engine accepts the badge; the catalog would have refused this visit. */
    const badge = v.access_method==="RF_BADGE";
    if (!pass && !gateReg && !badge) f.push(D(CLS.DATA, WHY.DOCKPASS));
    const bl = bringLeg(w,v);
    if (bl && !bl.trailer_id) f.push(D(CLS.DATA, WHY.IDENTIFY));
    if (!w.config.admit_live_load_without_dock && v.visit_type==="LIVE"){
      const t = bl && w.trailers[bl.trailer_id];
      if (t && t.destination==="AWAITING_ASSIGNMENT")
        f.push(D(CLS.PHYSICAL,"No dock assigned — this facility holds live loads outside"));
    }
    return f;
  },
  apply(w,c){
    const v = c.v;
    v.dockpass_consumed = true;
    v.presence = "ON_SITE"; v.admitted_at = w.clock; v.on_site_since = w.clock;
    v.held_outside = false;
    const bl = bringLeg(w,v);
    if (bl && bl.trailer_id){
      const t = w.trailers[bl.trailer_id];
      t.position = "AT_GATE_IN";
      rowsOf(w,t.id).filter(r => r.direction==="INBOUND").forEach(r => {
        w.shipments[r.shipment_id].status = "ARRIVED";
      });
      /* "if claimed empty" — read as nothing aboard, not load state EMPTY: an
         outbound live load already carries ASSIGNED rows from its TAKE leg. */
      if (!hasFreight(w,t.id) && t.empty_verification==="UNVERIFIED")
        t.empty_verification = "CLAIMED_EMPTY";
    }
    log("act","<b>ADMIT</b> — gate opened. Dockpass consumed; <b>presence → ON_SITE</b>.");
  }
},

REGISTER_AND_ADMIT:{
  label:"Register and admit (kiosk)", on:"visit", actor:"Kiosk / guard", ref:"model §5.1",
  gate(w,c){
    const v = c.v;
    if (!v) return [H(CLS.STRUCTURAL,"No visit in context")];
    if (v.registration!=="NOT_REGISTERED") return [H(CLS.STRUCTURAL,"Already registered")];
    if (["ON_SITE","DEPARTED"].includes(v.presence)) return [H(CLS.STRUCTURAL,"Already admitted")];
    return [];
  },
  form(w,c){
    const bl = bringLeg(w,c.v);
    return bl && !bl.trailer_id
      ? [{k:"number", label:"Trailer number", type:"text", def:bl.hint_number||""}] : [];
  },
  apply(w,c,vals){
    const v = c.v;
    v.registration = "REGISTERED_AT_GATE";
    if (v.arrived_at==null) v.arrived_at = w.clock;
    const bl = bringLeg(w,v);
    if (bl && !bl.trailer_id && vals.number) bindLeg(w,v,bl,vals.number,"GUARD");
    v.presence = "AT_GATE";
    ACTIONS.ADMIT.apply(w,c,{});
    log("sys","One transaction, same dimensions as the two-stage path (model §3.6.4).");
  }
},

HOLD_OUTSIDE:{
  label:"Hold outside the fence", on:"visit", actor:"Guard", ref:"model §5.1",
  gate(w,c){
    const v = c.v;
    if (!v) return [H(CLS.STRUCTURAL,"No visit in context")];
    if (!["AT_GATE","AT_FACILITY"].includes(v.presence))
      return [H(CLS.PHYSICAL,"Only a visit waiting at the gate can be held")];
    const bl = bringLeg(w,v);
    const t = bl && w.trailers[bl.trailer_id];
    if (t && t.destination==="DOCK_ASSIGNED")
      return [H(CLS.STRUCTURAL,"A dock is assigned — nothing to hold for")];
    if (w.config.has_inside_lot)
      return [H(CLS.STRUCTURAL,"This facility has an inside lot — admit and park instead")];
    return [];
  },
  apply(w,c){
    c.v.held_outside = true; c.v.presence = "AT_GATE";
    log("act","<b>HOLD_OUTSIDE</b> — held outside the fence; stays in the dock-assignment queue. Detention clock not started.");
  }
},

BIND_TRAILER_TO_LEG:{
  label:"Bind trailer to leg", on:"visit", actor:"Guard / driver", ref:"model §5.1 (§9 #37)",
  gate(w,c){
    const v = c.v;
    if (!v) return [H(CLS.STRUCTURAL,"No visit in context")];
    if (!v.legs.some(l => !l.trailer_id)) return [H(CLS.STRUCTURAL,"Every leg already names a trailer")];
    return [];
  },
  form(w,c){
    const free = c.v.legs.filter(l => !l.trailer_id);
    return [
      {k:"leg", label:"Leg", type:"select",
       options: free.map(l => [l.kind, l.kind + " leg"])},
      {k:"number", label:"Trailer number", type:"text", def:""}
    ];
  },
  apply(w,c,vals){
    const leg = c.v.legs.find(l => l.kind===vals.leg && !l.trailer_id);
    bindLeg(w, c.v, leg, vals.number, w.role==="DRIVER" ? "DRIVER" : "GUARD");
  }
},

VERIFY_EMPTY:{
  label:"Verify empty", on:"trailer", actor:"Guard", ref:"model §5.1 (§9 #6)",
  gate(w,c){
    if (!c.t) return [H(CLS.STRUCTURAL,"No trailer in context")];
    /* §5.1 says "load state EMPTY", but an outbound live load is ASSIGNED_ONLY
       from the moment its leg is bound — under the literal reading, VERIFY_EMPTY
       could never fire on the flow that needs it most. Read as nothing aboard. */
    if (hasFreight(w,c.t.id)) return [H(CLS.STRUCTURAL,"Freight aboard — not a candidate")];
    if (c.t.empty_verification==="VERIFIED_EMPTY") return [H(CLS.STRUCTURAL,"Already verified")];
    return [];
  },
  apply(w,c){
    c.t.empty_verification = "VERIFIED_EMPTY";
    log("act","<b>VERIFY_EMPTY</b> — physically confirmed empty.");
  }
},

TURN_AWAY:{
  label:"Turn away", on:"visit", actor:"Guard", ref:"model §5.1 · matrix §2.1",
  gate(w,c){
    const v = c.v;
    if (!v) return [H(CLS.STRUCTURAL,"No visit in context")];
    if (v.turned_away) return [H(CLS.STRUCTURAL,"Already turned away")];
    if (v.presence==="OFF_SITE") return [H(CLS.PHYSICAL,"Nothing here to turn away")];
    if (v.presence==="DEPARTED") return [H(CLS.PHYSICAL,"Already gone")];
    return [];
  },
  form(){ return [{k:"reason", label:"Reason code", type:"select", options:[
    ["APPT_MISMATCH","Appointment mismatch"],["NO_PAPERWORK","No paperwork"],
    ["EQUIP_REJECT","Equipment rejected"],["CAPACITY","No capacity today"]]}]; },
  apply(w,c,vals){
    const v = c.v;
    v.turned_away = true; v.turn_reason = vals.reason;
    w.assignments.filter(a => a.state==="HELD" &&
      v.legs.some(l => l.trailer_id===a.trailer_id)).forEach(a => {
        a.state = "RELEASED"; a.release_reason = "TURNED_AWAY";
        w.docks[a.dock].state = "FREE"; w.docks[a.dock].holder = null;
        const t = w.trailers[a.trailer_id];
        if (t) t.destination = "AWAITING_ASSIGNMENT";
      });
    log("act","<b>TURN_AWAY</b> — refused ("+vals.reason+"). Any held dock released.");
  }
},

RESOLVE_IDENTIFICATION:{
  label:"Resolve identification", on:"trailer", actor:"Clerk", ref:"model §5.1 · §2.15",
  gate(w,c){
    const open = w.idents.filter(i => i.unresolved &&
      (i.read_trailer===(c.t&&c.t.id) || i.declared_trailer===(c.t&&c.t.id)));
    if (!open.length) return [H(CLS.STRUCTURAL,"Identification is corroborated — nothing to settle")];
    return needRole(w, ["CLERK","SUPERVISOR","GUARD"]);
  },
  form(w,c){
    return [{k:"source", label:"Which source was correct?", type:"select", options:[
      ["GUARD","The guard / driver reading"],["CAMERA_AI","The camera reading"]]}];
  },
  apply(w,c,vals){
    const open = w.idents.filter(i => i.unresolved &&
      (i.read_trailer===c.t.id || i.declared_trailer===c.t.id));
    open.forEach(i => { i.unresolved = false; i.correct_source = vals.source; });
    if (c.t) c.t.identity_confidence = "CORROBORATED";
    log("act","<b>RESOLVE_IDENTIFICATION</b> — recorded that <b>"+vals.source+
      "</b> was right, and who decided. This is the per-source accuracy data (§10.7).");
  }
},

AUTHORIZE_DEPARTURE:{
  label:"Authorize departure", on:"visit", actor:"Clerk", ref:"model §5.1 · matrix §2.6",
  gate(w,c){
    const v = c.v;
    if (!v) return [H(CLS.STRUCTURAL,"No visit in context")];
    if (v.presence==="DEPARTED") return [H(CLS.STRUCTURAL,"Already departed")];
    if (v.presence==="AUTHORIZED_TO_DEPART") return [H(CLS.STRUCTURAL,"Already authorized")];
    if (!["ON_SITE"].includes(v.presence)) return [H(CLS.PHYSICAL,"The visit is not on site")];
    const f = [];
    const unbound = v.legs.filter(l => !l.trailer_id && !l.bobtail);
    if (unbound.length) f.push(D(CLS.DATA, WHY.IDENTIFY));
    const tl = takeLeg(w,v);
    if (tl && tl.trailer_id){
      const t = w.trailers[tl.trailer_id];
      f.push(...svc(w,t));
      const rows = rowsOf(w,t.id);
      const expected = (tl.expected_shipment_ids||[]);
      const residual = (tl.expected_residual_shipment_ids||[]);
      const aboard = rows.filter(r => r.link_state==="ON_BOARD").map(r => r.shipment_id);
      const stray = aboard.filter(s => !expected.includes(s) && !residual.includes(s));
      if (stray.length) f.push(D(CLS.DATA, WHY.RESIDUAL));
      if (rows.some(r => r.link_state==="PART_LOADED")) f.push(D(CLS.DATA, WHY.PART_LOADED));
      const outboundAboard = rows.some(r => r.direction==="OUTBOUND" && r.link_state==="ON_BOARD");
      if (outboundAboard){
        if (t.fill!=="COMPLETE") f.push(D(CLS.DATA, WHY.FILL_OPEN));
        else if (!t.sealed){
          if (v.party_type==="COMPANY_DRIVER")
            log0("Seal ceremony relaxed for a company driver (model §5.1) — the load match is not.");
          else f.push(D(CLS.DATA, WHY.NOT_SEALED));
        }
      }
      if (openSession(w,t.id)) f.push(D(CLS.PHYSICAL, WHY.SESSION_OPEN));
      if (openMove(w,t.id)) f.push(D(CLS.PHYSICAL, WHY.MOVE_OPEN));
    }
    return f;
  },
  apply(w,c){
    c.v.presence = "AUTHORIZED_TO_DEPART"; c.v.authorized_at = w.clock;
    log("act","<b>AUTHORIZE_DEPARTURE</b> — legs verified, freight matched. <b>presence → AUTHORIZED_TO_DEPART</b>.");
  }
},

CHECK_OUT:{
  label:"Check out", on:"visit", actor:"Gate", ref:"model §5.1 · flows P5b",
  gate(w,c){
    const v = c.v;
    if (!v) return [H(CLS.STRUCTURAL,"No visit in context")];
    if (v.presence==="DEPARTED") return [H(CLS.STRUCTURAL,"Already checked out")];
    if (v.presence!=="AUTHORIZED_TO_DEPART") return [D(CLS.DATA, WHY.NOT_AUTHORIZED)];
    return [];
  },
  apply(w,c){
    const v = c.v;
    const tl = takeLeg(w,v);
    v.presence = "DEPARTED"; v.departed_at = w.clock;
    if (tl && tl.trailer_id){
      const t = w.trailers[tl.trailer_id];
      releasePosition(w,t);
      t.position = "OFF_SITE"; t.tractor = false; t.destination = "NONE";
      rowsOf(w,t.id).filter(r => r.direction==="OUTBOUND").forEach(r => {
        w.shipments[r.shipment_id].status = "DEPARTED";
      });
      log("act","<b>CHECK_OUT</b> — <b>"+t.number+"</b> departed; outbound shipments <b>DEPARTED</b>.");
    } else {
      log("act","<b>CHECK_OUT</b> — departed bobtail. Exit read will return <b>NO_TRAILER</b>.");
      const expectedTake = v.legs.find(l => l.kind==="TAKE" && l.intended_trailer);
      if (expectedTake) v.pickup_not_taken = true;
    }
    log("sys","Engine sets <b>presence → DEPARTED</b> (glossary §5.4). The action catalog says "+
      "<b>CHECKED_OUT</b>, which is not a value of that dimension — finding F3.");
  }
},

DECLARE_TAKE_LEG_CHANGE:{
  label:"Declare take-leg change", on:"visit", actor:"Driver at the gate", ref:"model §5.1 (§9 #27)",
  gate(w,c){
    const v = c.v;
    if (!v) return [H(CLS.STRUCTURAL,"No visit in context")];
    if (v.presence==="DEPARTED") return [H(CLS.PHYSICAL,"Already gone — this is CORRECT_DEPARTURE now")];
    if (!["ON_SITE","AUTHORIZED_TO_DEPART"].includes(v.presence))
      return [H(CLS.PHYSICAL,"Only from on site, before check-out")];
    if (!takeLeg(w,v)) return [H(CLS.STRUCTURAL,"No TAKE leg to amend")];
    return [];
  },
  form(w,c){
    const here = Object.values(w.trailers).filter(t => onSite(t));
    return [{k:"sub", label:"Trailer actually taken", type:"select",
      options: [["__BOBTAIL__","Nothing — leaving bobtail"]].concat(
        here.map(t => [t.id, t.number + " · " + t.carrier +
          (hasFreight(w,t.id) ? " (carries freight)" : " (empty)")]))}];
  },
  apply(w,c,vals){
    const v = c.v, tl = takeLeg(w,v);
    const prev = tl.trailer_id;
    if (vals.sub==="__BOBTAIL__"){
      tl.intended_trailer = prev; tl.trailer_id = null; tl.bobtail = true;
      v.pickup_not_taken = true;
      log("act","<b>DECLARE_TAKE_LEG_CHANGE</b> — leaving bobtail. <b>"+
        (prev?w.trailers[prev].number:"—")+"</b> stays, preload intact, still aging.");
    } else {
      const sub = w.trailers[vals.sub];
      tl.trailer_id = sub.id; v.substituted = true;
      if (hasFreight(w,sub.id))
        log("dev","<b>SUBSTITUTE_CARRIES_FREIGHT</b> — "+sub.number+
          " carries another party's freight. Supervisor confirmation was required.");
      log("act","<b>DECLARE_TAKE_LEG_CHANGE</b> — TAKE leg amended to <b>"+sub.number+
        "</b>. Logged against both trailers; not an exception.");
    }
  },
  supIf(w,c,vals){
    /* supervisor confirmation only when the substitute carries freight (§5.1) */
    return vals && vals.sub && vals.sub!=="__BOBTAIL__" && hasFreight(w, vals.sub);
  }
},

/* ---------------- 5.2 Yard movement ------------------------------------ */
ASSIGN_DOCK:{
  label:"Assign dock", on:"trailer", actor:"Dispatcher", ref:"model §5.2 · §2.14",
  gate(w,c){
    const t = c.t;
    if (!t) return [H(CLS.STRUCTURAL,"No trailer in context")];
    if (t.destination==="DOCK_ASSIGNED") return [H(CLS.STRUCTURAL,"A dock is already held")];
    if (t.destination!=="AWAITING_ASSIGNMENT")
      return [H(CLS.STRUCTURAL,"Nothing to assign to yet — no destination is being sought")];
    const f = svc(w,t);
    if (!Object.values(w.docks).some(d => d.state==="FREE"))
      f.push(D(CLS.PHYSICAL,"No dock is free"));
    return f;
  },
  form(w){ return [{k:"dock", label:"Dock", type:"select",
    options: Object.values(w.docks).filter(d => d.state==="FREE").map(d => [d.id, "Dock "+d.id])}]; },
  apply(w,c,vals){
    const t = c.t, d = w.docks[vals.dock];
    d.state = "HELD"; d.holder = t.id;
    w.assignments.push({id:"DA"+(w.seq++), trailer_id:t.id, dock:d.id, state:"HELD", at:w.clock});
    t.destination = "DOCK_ASSIGNED"; t.requested_destination = "DOCK "+d.id;
    log("act","<b>ASSIGN_DOCK</b> — dock "+d.id+" <b>HELD</b>; <b>destination → DOCK_ASSIGNED</b>.");
    if (w.config.auto_create_move_on_dock_assignment && !t.tractor && onSite(t) && !openMove(w,t.id)){
      w.moves.push({id:"MV"+(w.seq++), trailer_id:t.id, requested_destination:"DOCK "+d.id,
        state:"PENDING", at:w.clock});
      log("sys","Facility is configured for automatic move creation — <b>MoveTask PENDING</b> with no human (§2.11).");
    }
    if (t.tractor) log("sys","Tractor attached: no move task. The driver is told where to go (§3.5).");
  }
},

RELEASE_DOCK:{
  label:"Release dock", on:"trailer", actor:"Dispatcher", ref:"model §5.2",
  gate(w,c){
    if (!c.t) return [H(CLS.STRUCTURAL,"No trailer in context")];
    if (!heldAssign(w,c.t.id)) return [H(CLS.STRUCTURAL,"No dock is held")];
    return [];
  },
  form(){ return [{k:"reason", label:"Reason", type:"select", options:[
    ["REASSIGNED","Reassigned"],["NO_SHOW","No-show"],["DOCK_OOS","Dock out of service"]]}]; },
  apply(w,c,vals){
    const a = heldAssign(w,c.t.id);
    a.state = "RELEASED"; a.release_reason = vals.reason;
    w.docks[a.dock].state = "FREE"; w.docks[a.dock].holder = null;
    c.t.destination = "AWAITING_ASSIGNMENT"; c.t.requested_destination = null;
    log("act","<b>RELEASE_DOCK</b> — dock "+a.dock+" freed ("+vals.reason+
      "); back to <b>AWAITING_ASSIGNMENT</b>.");
  }
},

ASSIGN_YARD:{
  label:"Assign yard", on:"trailer", actor:"Dispatcher", ref:"model §5.2 (§9 #8)",
  gate(w,c){
    const t = c.t;
    if (!t) return [H(CLS.STRUCTURAL,"No trailer in context")];
    if (t.destination==="YARD_ASSIGNED") return [H(CLS.STRUCTURAL,"Already going to the yard")];
    if (t.destination!=="AWAITING_ASSIGNMENT")
      return [H(CLS.STRUCTURAL,"No destination is being sought")];
    return svc(w,t);
  },
  form(w){ return [{k:"spot", label:"Specific spot (optional — the spotter may choose)",
    type:"select", options:[["", "Spotter's choice"]].concat(
      Object.values(w.spots).filter(s => !s.occupants.length).map(s => ["SPOT "+s.id,"Spot "+s.id]))
      .concat(Object.values(w.lots).map(l => ["LOT "+l.id, l.inside_fence?"Inside lot":"Outside lot"]))}]; },
  apply(w,c,vals){
    c.t.destination = "YARD_ASSIGNED";
    c.t.requested_destination = vals.spot || "YARD";
    log("act","<b>ASSIGN_YARD</b> — <b>destination → YARD_ASSIGNED</b>"+
      (vals.spot ? " ("+vals.spot+")" : ", spot left to the spotter")+".");
  }
},

DROP_TRAILER:{
  label:"Drop trailer", on:"trailer", actor:"Driver", ref:"model §5.2 — the handoff",
  gate(w,c){
    const t = c.t;
    if (!t) return [H(CLS.STRUCTURAL,"No trailer in context")];
    if (!t.tractor) return [H(CLS.STRUCTURAL,"No tractor attached")];
    if (!["DOCK","YARD_SPOT","LOT"].includes(t.position))

  apply(w,c){

      t.destination = "AWAITING_ASSIGNMENT";
      log("act","<b>DROP_TRAILER</b> — tractor detached. Yard-team responsibility now; "+
        "<b>destination → AWAITING_ASSIGNMENT</b>, move tasks become possible.");
      log("sys","<b>DROPPED_NO_DESTINATION</b> will now age with nobody waiting on it — "+
        "the quiet risk flows §5 names.");
    } else {
      log("act","<b>DROP_TRAILER</b> — tractor detached at its destination.");
    }
  }
